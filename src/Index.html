/* ===================== Importador ===================== */
let IMPF=null,IMP=null;
function hash(s){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (4294967296*(2097151&h2)+(h1>>>0)).toString(36)}
function parseFecha(v){
  if(typeof v==='number'&&v>20000&&v<80000)return new Date(Math.round((v-25569)*864e5)).toISOString().slice(0,10);
  if(v instanceof Date)return v.getFullYear()+'-'+p2(v.getMonth()+1)+'-'+p2(v.getDate());
  const s=norm(v);let m;
  if((m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/))){let y=+m[3];if(y<100)y+=2000;return y+'-'+p2(m[2])+'-'+p2(m[1])}
  if((m=s.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/)))return m[1]+'-'+p2(m[2])+'-'+p2(m[3]);
  if((m=s.match(/^(\d{4})[\/\-.](\d{1,2})$/)))return m[1]+'-'+p2(m[2])+'-01';           // Año/Mes
  if((m=s.match(/^(\d{1,2})[\/\-.](\d{4})$/)))return m[2]+'-'+p2(m[1])+'-01';           // Mes/Año
  if((m=s.match(/^(\d{1,2})[\s\-\/]([a-z]{3})[a-z.]*[\s\-\/](\d{2,4})/))){const i=MES3.indexOf(m[2]);if(i>=0){let y=+m[3];if(y<100)y+=2000;return y+'-'+p2(i+1)+'-'+p2(m[1])}}
  return null;
}
const FIELDS=[['f','Fecha o Año/Mes',true],['t','Tipo (gasto/ingreso/transferencia)'],['c','Cuenta',true],['k','Concepto'],['cat','Categoría'],['e','Etiqueta'],['d','Descripción'],['m','Importe (con signo)'],['mi','Importe ingreso (columna aparte)'],['mg','Importe gasto (columna aparte)'],['mon','Moneda']];
const GUESS={f:['fecha','ano/mes','año/mes','periodo','mes'],t:['tipo'],c:['cuenta'],k:['concepto','subcategoria','rubro'],cat:['categoria'],e:['etiqueta','tag'],d:['descrip','detalle','nota','comentario','observ'],m:['importe','monto','valor','total'],mi:['ingreso','haber','credito'],mg:['gasto','egreso','debe','debito'],mon:['moneda','divisa']};
async function onFile(inp){
  const file=inp.files[0];inp.value='';if(!file)return;
  if(!S.cfg){toast('Esperá a que carguen tus datos');return}
  if(!window.XLSX){toast('No cargó el lector de Excel. Recargá la página.');return}
  try{
    const buf=await file.arrayBuffer();let wb;
    if(/\.(csv|txt)$/i.test(file.name)){
      let txt;try{txt=new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(e){txt=new TextDecoder('windows-1252').decode(buf)}
      wb=XLSX.read(txt,{type:'string',raw:true});
    }else wb=XLSX.read(buf,{type:'array'});
    // busca la hoja y la fila de encabezados con más coincidencias
    let best=null;
    for(const sn of wb.SheetNames){
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:''});
      for(let i=0;i<Math.min(rows.length,40);i++){
        const sc=rows[i].filter(c=>{const n=norm(c);return n&&Object.values(GUESS).some(g=>g.some(w=>n.startsWith(w)))}).length;
        if(sc>=2&&(!best||sc>best.sc))best={sc,rows,hi:i,sn};
      }
    }
    if(!best)throw new Error('no encontré una fila de encabezados (Fecha, Cuenta, Importe…)');
    const H=best.rows[best.hi].map(c=>String(c).trim());
    const map={};const usado=new Set();
    for(const [k] of FIELDS){
      const i=H.findIndex((x,j)=>!usado.has(j)&&GUESS[k].some(w=>norm(x).startsWith(w)));
      map[k]=i;if(i>=0)usado.add(i);
    }
    if(map.m>=0){map.mi=-1;map.mg=-1}
    IMPF={rows:best.rows,hi:best.hi,H,map,fname:file.name,sheet:best.sn,cotUSD:cot()};
    renderMapeo();
  }catch(e){toast('No pude leer el archivo: '+(e.message||e))}
}
function parseImport(){
  const {rows,hi,map:M}=IMPF;const R=[];const seen={};let malas=0;
  const g=(r,k)=>M[k]>=0?r[M[k]]:'';
  for(let i=hi+1;i<rows.length;i++){
    const r=rows[i];if(!r||r.every(c=>String(c).trim()===''))continue;
    const f=parseFecha(g(r,'f'));
    let v=M.m>=0?parseNum(g(r,'m')):NaN;
    if(isNaN(v)&&(M.mi>=0||M.mg>=0)){const a=parseNum(g(r,'mi')),b=parseNum(g(r,'mg'));if(a)v=Math.abs(a);else if(b)v=-Math.abs(b)}
    const cn=String(g(r,'c')??'').replace(/\s+/g,' ').trim();
    if(!f||isNaN(v)||!cn||v===0){malas++;continue}
    const tt=norm(g(r,'t'));
    let t=/^(gas|egr|deb)/.test(tt)?'G':/^(ing|cre)/.test(tt)?'I':/^tra/.test(tt)?'T':/^aj/.test(tt)?'A':tt==='g'?'G':tt==='i'?'I':(v<0?'G':'I');
    const kn=String(g(r,'k')??'').replace(/\s+/g,' ').trim(),cat=String(g(r,'cat')??'').replace(/\s+/g,' ').trim();
    const e=String(g(r,'e')??'').trim(),d=String(g(r,'d')??'').trim(),mon=norm(g(r,'mon'));
    if(t!=='T'&&/^transferencia/i.test(kn)&&M.t<0)t='T';
    const key=[f,t,cn,kn,e,d,v].join('|');seen[key]=(seen[key]||0)+1;
    R.push({i,f,t,tt,cn,kn,cat,e,d,v,mon,id:'z'+hash(key+'#'+seen[key])});
  }
  return {R,malas};
}
function renderMapeo(){
  const I=IMPF,{R,malas}=parseImport();
  const sel=k=>`<select onchange="IMPF.map['${k}']=+this.value;renderMapeo()"><option value="-1">— ninguna —</option>${I.H.map((x,j)=>x?`<option value="${j}"${I.map[k]===j?' selected':''}>${h(x)}</option>`:'').join('')}</select>`;
  const sinDia=R.length&&R.every(x=>x.f.endsWith('-01'))&&I.map.f>=0&&/mes/.test(norm(I.H[I.map.f]));
  modal(`<h3>Importar: ${h(I.fname)}</h3>
   <p class="sm mu" style="margin-top:0">Hoja “${h(I.sheet)}”, encabezados en la fila ${I.hi+1}. Revisá qué columna corresponde a cada dato.</p>
   <div class="fld2">${FIELDS.map(([k,l,req])=>`<div class="fld"><label>${h(l)}${req?' *':''}</label>${sel(k)}</div>`).join('')}</div>
   <div class="card" style="padding:10px;margin:6px 0 10px;overflow:auto"><div class="sm" style="margin-bottom:6px"><b>${R.length}</b> filas válidas${malas?` · <span class="neg">${malas} sin fecha, cuenta o importe (se ignoran)</span>`:''}</div>
   <table class="pv"><tr><th>Fecha</th><th>Tipo</th><th>Cuenta</th><th>Concepto</th><th>Categoría</th><th>Importe</th></tr>
   ${R.slice(0,6).map(x=>`<tr><td>${x.f.split('-').reverse().join('/')}</td><td>${{G:'Gasto',I:'Ingreso',T:'Transf.',A:'Ajuste'}[x.t]}</td><td>${h(x.cn)}</td><td>${h(x.kn)}</td><td>${h(x.cat)}</td><td class="num">${NF.format(x.v)}</td></tr>`).join('')}</table></div>
   ${sinDia?'<p class="xs mu">Este archivo trae solo año y mes: cada movimiento se carga con fecha día 1 de su mes.</p>':''}
   <div class="btns" style="justify-content:flex-end"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn pri" ${R.length?'':'disabled'} onclick="analizar()">Continuar</button></div>`);
}
function analizar(){
  const {R}=parseImport();
  const esMN=IMPF.map.m>=0&&/m\/n|moneda nacional/.test(norm(IMPF.H[IMPF.map.m]));
  const TR=R.filter(x=>x.t==='T');const anyNeg=TR.some(x=>x.v<0);
  for(const x of TR){const txt=norm(x.tt+' '+x.kn+' '+x.d);
    x.role=anyNeg?(x.v<0?'o':'d'):(/hacia|enviad|salida/.test(txt)?'o':/desde|recib|entrada/.test(txt)?'d':'?')}
  const used=new Set(),pairs=[],solos=[];
  for(let a=0;a<TR.length;a++){const x=TR[a];if(used.has(a)||x.role==='d')continue;
    let best=-1,bs=1e9;
    for(let b=Math.max(0,a-8);b<Math.min(TR.length,a+9);b++){if(b===a||used.has(b))continue;const y=TR[b];
      if(y.f!==x.f||y.cn===x.cn)continue;if(y.role==='o')continue;
      const sc=Math.abs(b-a)+(Math.abs(Math.abs(y.v)-Math.abs(x.v))<0.005?0:5);if(sc<bs){bs=sc;best=b}}
    if(best>=0){used.add(a);used.add(best);const y=TR[best];pairs.push(x.role==='?'&&y.role==='?'&&best<a?[y,x]:[x,y])}
  }
  TR.forEach((x,a)=>{if(!used.has(a))solos.push(x)});
  // cuentas y conceptos (se comparan sin importar mayúsculas, tildes ni espacios)
  const accBy={};for(const c of S.cfg.cuentas)accBy[norm(c.n)]=c;
  const newAcc=[],newCon=[],catUpd=[];
  const getAcc=(n,mon)=>{const k=norm(n);if(!accBy[k]){const c={n,mon:/usd|u\$s|dolar/.test(mon||'')||/d[oó]lar|u\$s|usd|us\$/i.test(n)?'USD':'UYU',si:0};accBy[k]=c;newAcc.push(c)}return accBy[k]};
  const conBy={};for(const c of S.cfg.conceptos)conBy[c.tipo+norm(c.n)]=c;
  const getCon=(n,t,cat)=>{if(!n)n=t==='G'?'Gastos sin categoría':'Otros ingresos';const k=t+norm(n);
    if(!conBy[k]){const c={n,tipo:t,cat:cat||''};conBy[k]=c;newCon.push(c)}else if(cat&&!conBy[k].cat){conBy[k].cat=cat;catUpd.push(conBy[k])}
    return conBy[k].n};
  const usd=a=>a.mon==='USD';
  const conv=(v,a)=>esMN&&usd(a)?r2(v/IMPF.cotUSD):r2(v);
  const items=[];let nUSD=0;const T0=Date.now();
  for(const x of R){
    if(x.t==='G'||x.t==='I'){const a=getAcc(x.cn,x.mon);if(esMN&&usd(a))nUSD++;
      const o={id:x.id,t:x.t,f:x.f,c:a.n,k:getCon(x.kn,x.t,x.cat),m:conv(Math.abs(x.v),a),ts:T0+x.i};if(x.e)o.e=x.e;if(x.d)o.d=x.d;items.push(o)}
    else if(x.t==='A'){const a=getAcc(x.cn,x.mon);items.push({id:x.id,t:'A',f:x.f,c:a.n,m:conv(x.v,a),ts:T0+x.i,d:x.d||'Ajuste de saldo'})}
  }
  for(const [o,d] of pairs){const a=getAcc(o.cn,o.mon),b=getAcc(d.cn,d.mon);
    const it={id:'t'+hash(o.id+d.id),t:'T',f:o.f,c:a.n,c2:b.n,m:conv(Math.abs(o.v),a),ts:T0+o.i};
    if(a.mon!==b.mon||Math.abs(Math.abs(d.v)-Math.abs(o.v))>0.004)it.m2=conv(Math.abs(d.v),b);
    const desc=o.d||d.d;if(desc&&!/^(desde|hacia)\b/.test(norm(desc)))it.d=desc;if(o.e)it.e=o.e;items.push(it)}
  for(const x of solos){const a=getAcc(x.cn,x.mon);const sg=x.role==='o'?-1:x.role==='d'?1:Math.sign(x.v)||1;
    items.push({id:x.id,t:'A',f:x.f,c:a.n,m:conv(sg*Math.abs(x.v),a),ts:T0+x.i,d:'Transferencia sin pareja'+(x.d?': '+x.d:'')})}
  const ex=new Set(S.movs.map(x=>x.id));const nuevos=items.filter(x=>!ex.has(x.id)).length;
  const fs=items.map(x=>x.f).sort();
  const cnt={G:0,I:0,T:0,A:0};items.forEach(x=>cnt[x.t]++);
  let tg=0,ti=0;for(const x of items){const a=accBy[norm(x.c)];const v=a&&a.mon==='USD'?x.m*IMPF.cotUSD:x.m;if(x.t==='G')tg+=v;else if(x.t==='I')ti+=v}
  IMP={items,newAcc,newCon,catUpd};
  modal(`<h3>Importar de ZetaCuentas</h3>
   <div class="kv"><span>Movimientos</span><b>${items.length}</b></div>
   <div class="kv sm"><span class="mu">Período</span><span>${fs[0].split('-').reverse().join('/')} – ${fs[fs.length-1].split('-').reverse().join('/')}</span></div>
   <div class="kv sm"><span class="mu">Gastos · Ingresos · Transferencias · Ajustes</span><span>${cnt.G} · ${cnt.I} · ${cnt.T} · ${cnt.A}</span></div>
   <div class="kv sm"><span class="mu">Total gastos / ingresos</span><span class="num"><span class="neg">${fmt(tg,'UYU')}</span> / <span class="pos">${fmt(ti,'UYU')}</span></span></div>
   ${solos.length?`<div class="kv sm"><span class="aj">Transferencias sin pareja (entran como ajuste)</span><span>${solos.length}</span></div>`:''}
   <div class="kv sm"><span class="mu">Nuevos (no estaban cargados)</span><b>${nuevos}</b></div>
   ${nUSD?`<div class="card" style="padding:10px;margin:8px 0"><div class="sm">Hay <b>${nUSD}</b> movimientos de cuentas en dólares, pero el archivo trae los importes ya pasados a pesos. Para guardarlos en dólares se dividen por esta cotización:</div>
     <div class="fld" style="margin:8px 0 0"><input type="text" inputmode="decimal" value="${String(IMPF.cotUSD).replace('.',',')}" onchange="const v=parseNum(this.value);if(v>0){IMPF.cotUSD=v;analizar()}"></div></div>`:''}
   ${newAcc.length?`<p class="sm" style="margin-bottom:4px"><b>Cuentas nuevas (${newAcc.length}):</b></p><div class="sm mu">${newAcc.map(c=>h(c.n)+' <span class="chip">'+sym(c.mon)+'</span>').join(', ')}</div>`:''}
   ${newCon.length?`<p class="sm" style="margin-bottom:4px"><b>Conceptos nuevos (${newCon.length}):</b></p><div class="sm mu">${newCon.map(c=>h(c.n)+(c.cat?' <span class="xs">('+h(c.cat)+')</span>':'')).join(', ')}</div>`:''}
   <p class="xs mu">La moneda de cada cuenta sale del nombre (“Dólares”, “U$S”). Se puede cambiar después en Cuentas.</p>
   <div class="btns" style="justify-content:flex-end"><button class="btn" onclick="renderMapeo()">‹ Volver</button><button class="btn pri" id="btnImp" onclick="aplicarImport()">Importar</button></div>`);
}
async function aplicarImport(){
  const {items,newAcc,newCon}=IMP;IMP=null;
  const b=document.getElementById('btnImp');b.disabled=true;b.textContent='Guardando en el Sheet…';
  S.cfg.cuentas.push(...newAcc);S.cfg.conceptos.push(...newCon);
  const idx={};S.movs.forEach((x,i)=>idx[x.id]=i);
  for(const x of items){if(idx[x.id]!=null)S.movs[idx[x.id]]=x;else{idx[x.id]=S.movs.length;S.movs.push(x)}}
  invalidate();
  try{
    await saveCfg();
    for(let i=0;i<items.length;i+=1000){b.textContent=`Guardando… ${Math.min(i+1000,items.length)}/${items.length}`;await op('importMovs',JSON.stringify(items.slice(i,i+1000)))}
    closeModal();V.per=ym(hoy());go('inicio');toast(`Importados ${items.length} movimientos`);
  }catch(e){closeModal()}
}

/* ===================== Arranque ===================== */
buildNav();render();
if(window.google&&google.script)load();else{S.err='Esta página tiene que abrirse desde la aplicación web de Google Apps Script.';render()}
</script>
