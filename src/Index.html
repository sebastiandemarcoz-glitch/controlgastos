<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Control de Gastos</title>
<style>
:root{
  --bg:#f3f4f7;--card:#fff;--tx:#1b2130;--mu:#6b7385;--ln:#e4e6ec;
  --ac:#0f8a6c;--ac2:#e7f5f0;--rojo:#d23c3c;--verde:#14915f;--azul:#2f6fd6;--amb:#b7791f;
  --sh:0 1px 2px rgba(20,30,50,.06),0 2px 8px rgba(20,30,50,.05);
  --sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#12151b;--card:#1b1f27;--tx:#e8eaf0;--mu:#9aa2b3;--ln:#2a303b;--ac:#2bb48f;--ac2:#173029;
  --rojo:#ef6b6b;--verde:#3ccf8e;--azul:#6b9cf0;--amb:#e0a84a;--sh:none}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
#app{display:grid;grid-template-columns:minmax(0,1fr);min-height:100vh}
main{min-width:0}
#side{display:none}
main{padding:calc(var(--sat) + 8px) 14px calc(90px + var(--sab));max-width:980px;width:100%;margin:0 auto}
header.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0 12px}
header.top h1{font-size:22px;margin:0}
#sync{font-size:12px;color:var(--mu);white-space:nowrap;background:none;border:0;cursor:pointer;padding:4px}
#tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding-bottom:var(--sab);z-index:20}
#tabs button,#side button.nv{flex:1;background:none;border:0;padding:8px 2px 7px;font-size:11px;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
#tabs button svg,#side svg{width:22px;height:22px}
#tabs button.on,#side button.on{color:var(--ac)}
#fab{position:fixed;right:18px;bottom:calc(72px + var(--sab));width:56px;height:56px;border-radius:50%;border:0;background:var(--ac);color:#fff;font-size:30px;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer;z-index:21}
#tabs button{font-size:10.5px}
@media (min-width:900px){
  #app{grid-template-columns:220px minmax(0,1fr)}
  #side{display:flex;flex-direction:column;gap:2px;background:var(--card);border-right:1px solid var(--ln);padding:18px 10px;position:sticky;top:0;height:100vh}
  #side .brand{font-weight:700;font-size:17px;padding:4px 10px 16px;color:var(--ac)}
  #side button.nv{flex:none;flex-direction:row;font-size:15px;gap:12px;padding:10px 12px;border-radius:10px;justify-content:flex-start}
  #side button.nv.on{background:var(--ac2)}
  #side .newbtn{margin:0 4px 14px;padding:10px;border-radius:10px;border:0;background:var(--ac);color:#fff;font-weight:600;cursor:pointer}
  #tabs,#fab{display:none}
  main{padding:20px 28px 40px}
}
.card{background:var(--card);border-radius:14px;box-shadow:var(--sh);padding:14px 16px;margin-bottom:12px;border:1px solid var(--ln)}
.card h2{font-size:14px;margin:0 0 10px;color:var(--mu);font-weight:600;text-transform:uppercase;letter-spacing:.03em;display:flex;justify-content:space-between;align-items:center;gap:8px}
.grid2{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.grid2>*{min-width:0}
.kv>span:first-child{min-width:0;overflow-wrap:anywhere}
@media (min-width:760px){.grid2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.grid2>.card{margin:0}}
.big{font-size:30px;font-weight:700;letter-spacing:-.01em}
.mu{color:var(--mu)}.sm{font-size:13px}.xs{font-size:12px}
.neg{color:var(--rojo)}.pos{color:var(--verde)}.tr{color:var(--azul)}.aj{color:var(--amb)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--ln);cursor:pointer}
.row:last-child{border-bottom:0}
.row .mid{flex:1;min-width:0}
.row .t1{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t2{font-size:12.5px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ico{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none;color:#fff}
.ico.G{background:var(--rojo)}.ico.I{background:var(--verde)}.ico.T{background:var(--azul)}.ico.A{background:var(--amb)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:4px 0}
.day{font-size:12px;font-weight:600;color:var(--mu);padding:12px 0 2px;display:flex;justify-content:space-between}
.day span:first-child::first-letter{text-transform:uppercase}
.bar{height:8px;border-radius:4px;background:var(--ln);overflow:hidden;margin-top:5px}
.bar>i{display:block;height:100%;background:var(--ac);border-radius:4px}
.bar.G>i{background:var(--rojo)}.bar.I>i{background:var(--verde)}
.btn{border:1px solid var(--ln);background:var(--card);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:500}
.btn.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
.btn.dan{color:var(--rojo)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.pnav{display:flex;align-items:center;gap:6px}
.pnav b{min-width:140px;text-align:center}
.pnav b::first-letter{text-transform:uppercase}
.pnav button{border:0;background:var(--ac2);color:var(--ac);width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.filters select,.filters input{flex:1 1 140px;min-width:0}
select,input[type=text],input[type=date],input[type=number],input[type=search]{border:1px solid var(--ln);background:var(--bg);border-radius:10px;padding:9px 10px;width:100%;outline:none}
select:focus,input:focus{border-color:var(--ac)}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;gap:3px;border:1px solid var(--ln)}
.seg button{flex:1;white-space:nowrap;border:0;background:none;padding:7px 6px;border-radius:8px;cursor:pointer;font-weight:500;font-size:13.5px;color:var(--mu)}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:var(--sh)}
.seg button.on.G{color:var(--rojo)}.seg button.on.I{color:var(--verde)}.seg button.on.T{color:var(--azul)}.seg button.on.A{color:var(--amb)}
.totals{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin-top:10px;align-items:center}
#modal{position:fixed;inset:0;background:rgba(10,14,22,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
#modal[hidden]{display:none}
#sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + var(--sab))}
@media (min-width:620px){#modal{align-items:center}#sheet{border-radius:18px}}
#sheet h3{margin:0 0 12px;font-size:18px}
.fld{margin-bottom:11px}
.fld label{display:block;font-size:12.5px;color:var(--mu);margin-bottom:4px}
.fld2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input.amount{font-size:26px;font-weight:700;padding:10px 12px}
#toast{position:fixed;left:50%;bottom:calc(140px + var(--sab));transform:translateX(-50%);background:#222a38;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;max-width:90vw}
#toast.on{opacity:1}
.empty{text-align:center;color:var(--mu);padding:26px 10px}
.chip{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:9px;background:var(--ac2);color:var(--ac);margin-left:4px;font-weight:500}
.cols{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:6px}
.cols .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;height:100%;justify-content:flex-end;cursor:pointer}
.cols .pair{display:flex;gap:2px;align-items:flex-end;flex:1;width:100%;justify-content:center}
.cols .pair i{width:42%;max-width:14px;border-radius:3px 3px 0 0;display:block}
.cols .c span{font-size:10.5px;color:var(--mu)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mu);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.welcome{max-width:560px;margin:30px auto}
.loading{text-align:center;color:var(--mu);padding:60px 10px}
table.pv{width:100%;border-collapse:collapse;font-size:12px}
table.pv td,table.pv th{border-bottom:1px solid var(--ln);padding:4px 5px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
table.pv th{color:var(--mu);font-weight:600}
.banner{display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;background:var(--ac2);border-color:var(--ac);color:var(--ac)}
.ib{position:relative;display:inline-flex}
.badge{position:absolute;top:-5px;right:-9px;background:var(--rojo);color:#fff;font-style:normal;font-size:10px;font-weight:700;border-radius:9px;padding:1px 5px;line-height:1.3}
.badge[hidden]{display:none}
.nt{font-size:13px;color:var(--mu);background:var(--bg);border-radius:8px;padding:8px 10px;margin:6px 0 10px;word-break:break-word}
.pc .fld{margin-bottom:8px}
textarea{border:1px solid var(--ln);background:var(--bg);border-radius:10px;padding:9px 10px;width:100%;font:inherit;color:inherit;min-height:70px}
code.tok{background:var(--bg);padding:2px 6px;border-radius:6px;font-size:13px;user-select:all}
.gcell{position:relative;overflow:hidden;padding:7px 8px;border-radius:6px;background:var(--bg)}
.gcell>.gb{position:absolute;left:0;top:0;bottom:0;opacity:.32;border-radius:6px 0 0 6px}
.gcell>.gb.full{border-radius:6px}
.gcell>span{position:relative;font-weight:600}
.gcell>small{position:relative;float:right;font-weight:700;margin-left:6px}
.sem-v{background:#22a55a}.sem-a{background:#e6b800}.sem-r{background:#e03b3b}
.tx-v{color:#178a47}.tx-a{color:#a37f00}.tx-r{color:#d23c3c}
.resumen{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:var(--bg);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.resumen b{font-size:15px}
@media (max-width:600px){.resumen{grid-template-columns:1fr 1fr}}
table.pr{width:100%;border-collapse:collapse;font-size:14px}
table.pr th{font-size:11.5px;color:var(--mu);text-align:right;font-weight:600;padding:6px 6px;border-bottom:1px solid var(--ln);text-transform:uppercase;letter-spacing:.02em}
table.pr td{padding:8px 6px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--ln);vertical-align:top}
table.pr td:first-child{text-align:left;white-space:normal;width:100%}
table.pr tr.cat td{font-weight:700;background:var(--bg);border-bottom:0}
table.pr tr.cat td:first-child{border-radius:8px 0 0 8px}table.pr tr.cat td:last-child{border-radius:0 8px 8px 0}
table.pr tr.sub td:first-child{padding-left:16px}
table.pr tr.sub,table.pr tr.cat1{cursor:pointer}
table.pr td.pct{font-weight:800;min-width:46px}
table.pr.ed td{padding:5px 6px}
table.pr input{width:120px;text-align:right;padding:6px 8px}
details.sinp{margin-top:12px;border:1px solid var(--ln);border-radius:12px;padding:4px 10px}
details.sinp summary{display:flex;justify-content:space-between;cursor:pointer;padding:8px 0;font-weight:600;font-size:14px;list-style:none}
details.sinp summary::-webkit-details-marker{display:none}
details.sinp summary span::before{content:'▸ ';color:var(--mu)}
details.sinp[open] summary span::before{content:'▾ '}
@media (max-width:600px){table.pr{font-size:13px}table.pr .disp{display:none}table.pr td,table.pr th{padding-left:4px;padding-right:4px}}
table.pr.old{width:100%}
table.pr th:first-child{text-align:left}
.mas a{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--ln);color:var(--tx);text-decoration:none;cursor:pointer}
.mas a svg{width:22px;height:22px;color:var(--ac)}
.qbtn{min-width:44px}
table.pv.fs td{white-space:normal;max-width:none;overflow:visible}
table.pv.fs input{width:120px}
.catH{font-size:12px;font-weight:600;color:var(--mu);margin:12px 0 2px;text-transform:uppercase;letter-spacing:.03em}
</style>
</head>
<body>
<div id="app">
  <aside id="side"></aside>
  <main>
    <header class="top"><h1 id="title">Inicio</h1><button id="sync" onclick="load()" title="Actualizar"></button></header>
    <div id="view"><div class="loading">Cargando…</div></div>
  </main>
  <nav id="tabs"></nav>
  <button id="fab" onclick="openMov()" aria-label="Nuevo movimiento">+</button>
</div>
<div id="modal" hidden onclick="if(event.target===this)closeModal()"><div id="sheet"></div></div>
<div id="toast"></div>
<input type="file" id="pdfIn" accept=".pdf,application/pdf" hidden onchange="onPDF(this)">
<input type="file" id="fileIn" accept=".csv,.xls,.xlsx,.txt" hidden onchange="onFile(this)">
<script>
/* Si algo falla al abrir, se muestra el motivo en pantalla en vez de quedarse en "Cargando". */
window.__errs=[];
window.onerror=function(m,src,l,c){window.__errs.push(m+' (línea '+l+')');mostrarFallo();};
window.addEventListener('unhandledrejection',function(e){window.__errs.push('Promesa: '+(e.reason&&e.reason.message||e.reason));});
function mostrarFallo(){var v=document.getElementById('view');if(!v)return;
  v.innerHTML='<div style="background:#fff3f3;border:1px solid #e6b3b3;border-radius:12px;padding:14px;margin:10px 0;font-size:14px;color:#8a1f1f"><b>La app no pudo abrir.</b><br>Mandale este texto a Claude:<pre style="white-space:pre-wrap;font-size:12px;margin:8px 0 0">'+
  (window.__errs.join('\n')||'sin error visible')+'\nNavegador: '+navigator.userAgent+'</pre><button onclick="location.reload()" style="margin-top:8px;padding:8px 14px">Recargar</button></div>';}
setTimeout(function(){var v=document.getElementById('view');if(v&&/^\s*Cargando…\s*$/.test(v.textContent)){window.__errs.push('El código de la pantalla no arrancó');mostrarFallo();}},20000);
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* ===================== Estado ===================== */
const S={cfg:null,movs:[],ready:false,err:null,sheet:'',notifs:{pend:[],rec:[],cuotas:[]},reglas:[],token:'',fijos:[],difs:[]};
const V={tab:'inicio',per:ym(hoy()),f:{c:'',k:'',t:'',q:'',e:''},show:300,
  inf:{per:ym(hoy()),tipo:'G',by:'cat'},verArch:false};
let F=null;
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MES3=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];

/* ===================== Utilidades ===================== */
function p2(n){return String(n).padStart(2,'0')}
function hoy(){const d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function ym(f){return f.slice(0,7)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function h(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function js(s){return h(JSON.stringify(String(s??'')))}
function norm(s){return String(s??'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\s+/g,' ').trim()}
function clone(o){return JSON.parse(JSON.stringify(o))}
const NF=new Intl.NumberFormat('es-UY',{minimumFractionDigits:2,maximumFractionDigits:2});
function sym(mon){return mon==='USD'?'U$S':'$'}
function fmt(v,mon){return sym(mon)+' '+NF.format(Math.abs(v)<0.005?0:v)}
function fmtS(v,mon){return (v<-0.004?'−':'')+fmt(Math.abs(v),mon)}
function parseNum(v){
  if(typeof v==='number')return v;
  let s=String(v??'').trim();const par=/^\(.*\)$/.test(s);
  s=s.replace(/[^\d,.\-]/g,'');if(!s||s==='-')return NaN;
  const lc=s.lastIndexOf(','),ld=s.lastIndexOf('.');
  if(lc>-1&&ld>-1){s=lc>ld?s.replace(/\./g,'').replace(',','.'):s.replace(/,/g,'')}
  else if(lc>-1){s=s.replace(/\./g,'').replace(',','.')}
  else if(/^-?\d{1,3}(\.\d{3})+$/.test(s)){s=s.replace(/\./g,'')}
  const n=parseFloat(s);return par?-Math.abs(n):n;
}
function r2(n){return Math.round(n*100)/100}
function perLabel(p){if(!p)return 'todo el período';if(p.length===4)return 'año '+p;const[y,m]=p.split('-');return MESES[+m-1]+' '+y}
function perStep(p,n){if(p.length===4)return String(+p+n);let[y,m]=p.split('-').map(Number);m+=n;while(m>12){m-=12;y++}while(m<1){m+=12;y--}return y+'-'+p2(m)}
function fechaLarga(f){const d=new Date(f+'T12:00');return DIAS[d.getDay()]+' '+d.getDate()+' de '+MESES[d.getMonth()]+(f.slice(0,4)!==hoy().slice(0,4)?' '+f.slice(0,4):'')}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),3000)}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

/* ===================== Datos derivados ===================== */
let _movs=null,_acc=null,_con=null;
function invalidate(){_movs=null;_acc=null;_con=null}
function movs(){if(!_movs){_movs=[...S.movs].sort((x,y)=>x.f<y.f?1:x.f>y.f?-1:((y.ts||0)-(x.ts||0)))}return _movs}
function acc(n){if(!_acc){_acc={};for(const c of S.cfg.cuentas)_acc[c.n]=c}return _acc[n]}
function con(t,n){if(!_con){_con={};for(const c of S.cfg.conceptos)_con[c.tipo+'|'+c.n]=c}return _con[t+'|'+n]}
function catOf(x){const c=con(x.t,x.k);return (c&&c.cat)||'Sin categoría'}
function monOf(n){const a=acc(n);return a?a.mon:'UYU'}
function cot(){return +S.cfg.cot||1}
function toUYU(v,mon){return mon==='USD'?v*cot():v}
function saldos(hasta){
  hasta=hasta||hoy();const r={};
  for(const c of S.cfg.cuentas)r[c.n]={s:+c.si||0,fut:0};
  const add=(n,v,f)=>{const o=r[n];if(!o)return;if(f<=hasta)o.s+=v;else o.fut+=v};
  for(const x of S.movs){
    if(x.t==='T'){add(x.c,-x.m,x.f);add(x.c2,x.m2??x.m,x.f)}
    else add(x.c,x.t==='G'?-x.m:x.m,x.f);
  }
  return r;
}
function efecto(x,n){
  if(x.t==='T'){let v=0;if(x.c===n)v-=x.m;if(x.c2===n)v+=(x.m2??x.m);return v}
  return x.c===n?(x.t==='G'?-x.m:x.m):0;
}
function titulo(x){if(x.t==='T')return 'Transferencia';if(x.t==='A')return 'Ajuste de saldo';return x.k||'Sin concepto'}
function enPer(x,p){return !p||x.f.startsWith(p)}
function sumGI(list){let g=0,i=0;for(const x of list){if(x.t==='G')g+=toUYU(x.m,monOf(x.c));else if(x.t==='I')i+=toUYU(x.m,monOf(x.c))}return{g,i}}
function sortN(a){return [...a].sort((x,y)=>x.n.localeCompare(y.n,'es'))}

/* ===================== Servidor (Google Sheet) ===================== */
let chain=Promise.resolve(),pend=0;
function call(fn,...a){return new Promise((res,rej)=>google.script.run.withSuccessHandler(res).withFailureHandler(rej).rpc(fn,JSON.stringify(a)))}
function setSync(){
  const el=document.getElementById('sync');
  el.textContent=pend?'Guardando…':S.ready?'✓ Guardado en Google Sheets ⟳':'Conectando…';
}
function op(fn,...a){
  pend++;setSync();
  const p=chain.then(()=>call(fn,...a)).then(r=>{pend--;setSync();return r},e=>{pend--;setSync();toast('No se pudo guardar en el Sheet: '+(e&&e.message||e));load();throw e});
  chain=p.catch(()=>{});return p;
}
function saveCfg(ren){return op('saveCfg',JSON.stringify({cot:S.cfg.cot,cuentas:S.cfg.cuentas,conceptos:S.cfg.conceptos,ren:ren||{}}))}
let _lento=null;
async function load(){
  if(pend)return;
  clearTimeout(_lento);
  if(!S.ready)_lento=setTimeout(()=>{if(!S.ready){document.getElementById('view').innerHTML=`<div class="card welcome"><h3 style="margin-top:0">Está tardando más de lo normal</h3>

  const sal=saldos();
  const grp=mon=>{
    const cs=S.cfg.cuentas.filter(c=>c.mon===mon&&(V.verArch||!c.arch));
    if(!cs.length)return '';
    let t=0;for(const c of cs)t+=sal[c.n].s;
    return `<div class="card"><h2>${mon==='USD'?'Dólares':'Pesos'}<span class="num" style="text-transform:none;color:var(--tx)">${fmtS(t,mon)}</span></h2>
      ${cs.map(c=>`<div class="row" onclick="verCuenta(${js(c.n)})"><div class="mid"><div class="t1">${h(c.n)}${c.arch?'<span class="chip">archivada</span>':''}</div>
       ${Math.abs(sal[c.n].fut)>0.005?`<div class="t2">Futuro: ${fmtS(sal[c.n].fut,mon)}</div>`:''}</div>
       <div class="num ${sal[c.n].s<0?'neg':''}">${fmtS(sal[c.n].s,mon)}</div>
       <button class="btn sm" onclick="event.stopPropagation();openCuenta(${js(c.n)})">Editar</button></div>`).join('')}</div>`;
  };
  return `<div class="btns" style="margin-bottom:12px"><button class="btn pri" onclick="fijarSaldos()">Fijar saldos de hoy</button><button class="btn" onclick="openCuenta()">+ Nueva cuenta</button>
   <button class="btn" onclick="cargarPDF()">📄 Conciliar estado de cuenta</button>
   <button class="btn" onclick="V.verArch=!V.verArch;render()">${V.verArch?'Ocultar':'Mostrar'} archivadas</button></div>
   ${grp('UYU')}${grp('USD')}
   ${!S.cfg.cuentas.length?'<div class="card empty">Creá tu primera cuenta (efectivo, caja de ahorro, tarjeta…)</div>':''}`;
}
let _editAcc=null;
function openCuenta(n){
  _editAcc=n||null;
  const c=n?acc(n):{n:'',mon:'UYU',si:0,arch:false};
  modal(`<h3>${n?'Editar cuenta':'Nueva cuenta'}</h3>
   <form onsubmit="event.preventDefault();saveCuenta()">
   <div class="fld"><label>Nombre</label><input type="text" id="cu_n" value="${h(c.n)}" required></div>
   <div class="fld2"><div class="fld"><label>Moneda</label><select id="cu_m"><option value="UYU"${c.mon==='UYU'?' selected':''}>Pesos ($)</option><option value="USD"${c.mon==='USD'?' selected':''}>Dólares (U$S)</option></select></div>
   <div class="fld"><label>Saldo de partida</label><input type="text" inputmode="decimal" id="cu_s" value="${c.si?String(c.si).replace('.',','):''}" placeholder="0"></div></div>
   <div class="fld"><label><input type="checkbox" id="cu_a"${c.arch?' checked':''}> Archivada (no se muestra en listas)</label></div>
   <div class="btns" style="justify-content:space-between"><div>${n?`<button type="button" class="btn dan" onclick="delCuenta()">Eliminar</button>`:''}</div>
   <div class="btns"><button type="button" class="btn" onclick="closeModal()">Cancelar</button><button class="btn pri">Guardar</button></div></div></form>`);
  setTimeout(()=>document.getElementById('cu_n').focus(),50);
}
function saveCuenta(){
  const old=_editAcc;
  const n=document.getElementById('cu_n').value.trim();if(!n)return;
  if(n!==old&&acc(n)){toast('Ya existe una cuenta con ese nombre');return}
  const o={n,mon:document.getElementById('cu_m').value,si:r2(parseNum(document.getElementById('cu_s').value)||0),arch:document.getElementById('cu_a').checked};
  const ren={};
  if(old){Object.assign(acc(old),o);if(old!==n){ren.c={[old]:n};for(const x of S.movs){if(x.c===old)x.c=n;if(x.c2===old)x.c2=n}}}
  else S.cfg.cuentas.push(o);
  invalidate();saveCfg(ren);closeModal();render();toast('Cuenta guardada');
}
function delCuenta(){
  const n=_editAcc,cant=S.movs.filter(x=>x.c===n||x.c2===n).length;
  if(cant){toast(`Tiene ${cant} movimientos: archivala en lugar de eliminarla`);return}
  confirmar('¿Eliminar esta cuenta?',()=>{S.cfg.cuentas=S.cfg.cuentas.filter(c=>c.n!==n);invalidate();saveCfg();closeModal();render()});
}
function ajustarSaldo(an){
  const a=acc(an),f=hoy(),s=saldos(f)[an].s;
  modal(`<h3>Ajustar saldo</h3><p class="mu sm">${h(a.n)} · saldo según la app: <b class="num">${fmtS(s,a.mon)}</b></p>
  <form onsubmit="event.preventDefault();doAjuste(${js(an)})">
  <div class="fld"><label>Saldo real</label><input type="text" inputmode="decimal" class="amount" id="aj_v" required></div>
  <div class="fld"><label>Fecha</label><input type="date" id="aj_f" value="${f}"></div>
  <div class="btns" style="justify-content:flex-end"><button type="button" class="btn" onclick="closeModal()">Cancelar</button><button class="btn pri">Ajustar</button></div></form>`);
  setTimeout(()=>document.getElementById('aj_v').focus(),50);
}
function doAjuste(an){
  const real=parseNum(document.getElementById('aj_v').value);if(isNaN(real))return;
  const f=document.getElementById('aj_f').value||hoy();
  const d=r2(real-saldos(f)[an].s);
  if(Math.abs(d)<0.005){closeModal();toast('El saldo ya coincide');return}
  const x={id:uid(),t:'A',f,c:an,m:d,ts:Date.now(),d:'Ajuste de saldo'};
  S.movs.push(x);invalidate();op('saveMov',JSON.stringify(x));
  closeModal();render();toast('Saldo ajustado');
}

/* ---------- Fijar saldos de hoy ---------- */
function esTC(n){return /^tc\b|tarjeta|cr[eé]dito|visa|master|\boca\b/i.test(norm(n))}
function fijarSaldos(){
  const sal=saldos(),f=hoy();
  const cs=S.cfg.cuentas.filter(c=>!c.arch);
  const fila=c=>{const tc=esTC(c.n),s=sal[c.n].s,fut=sal[c.n].fut;
    return `<tr><td>${h(c.n)}<div class="xs mu">${tc?'Deuda según la app':'Saldo según la app'}: <span class="num">${tc?fmt(Math.max(0,-s),c.mon)+(s>0.004?' (a favor '+fmt(s,c.mon)+')':''):fmtS(s,c.mon)}</span>${Math.abs(fut)>0.004?` · cuotas futuras: <span class="num">${fmt(Math.abs(fut),c.mon)}</span>`:''}</div></td>
      <td style="text-align:right"><input type="text" inputmode="decimal" data-acc="${h(c.n)}" data-tc="${tc?1:0}" placeholder="${tc?'deuda':'saldo'}" style="width:130px;text-align:right"><div class="xs mu">${sym(c.mon)}</div></td></tr>`};
  modal(`<h3>Fijar saldos de hoy</h3>
   <p class="sm mu" style="margin-top:0">Escribí lo que tenés <b>hoy</b> en cada cuenta. En las tarjetas poné <b>lo que debés hoy</b> (lo que todavía no pagaste, sin las cuotas futuras). Dejá vacío lo que no quieras cambiar. Tu historial no se modifica: la app recalcula el saldo de partida.</p>
   <div style="max-height:56vh;overflow:auto"><table class="pv fs" style="font-size:13.5px">
    ${cs.filter(c=>!esTC(c.n)).length?`<tr><th colspan="2">Cuentas bancarias y efectivo</th></tr>${cs.filter(c=>!esTC(c.n)).map(fila).join('')}`:''}
    ${cs.filter(c=>esTC(c.n)).length?`<tr><th colspan="2" style="padding-top:12px">Tarjetas de crédito (deuda de hoy)</th></tr>${cs.filter(c=>esTC(c.n)).map(fila).join('')}`:''}
   </table></div>
   <p class="xs mu">Las cuotas que vencen en meses próximos quedan aparte, como “futuro”, y se van sumando a la deuda cuando llega su mes.</p>
   <div class="btns" style="justify-content:flex-end"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn pri" onclick="guardarSaldos()">Guardar saldos</button></div>`);
}
function guardarSaldos(){
  const sal=saldos();let n=0;
  document.querySelectorAll('input[data-acc]').forEach(i=>{
    if(!i.value.trim())return;
    let v=parseNum(i.value);if(isNaN(v))return;
    if(i.dataset.tc==='1')v=-Math.abs(v);
    const c=acc(i.dataset.acc);c.si=r2((+c.si||0)+(v-sal[c.n].s));n++;
  });
  if(!n){closeModal();return}
  invalidate();saveCfg();closeModal();render();toast(`Saldos fijados en ${n} cuenta${n>1?'s':''}`);
}

/* ---------- Informes ---------- */
function vInformes(){

  const list=movs().filter(x=>x.t===I.tipo&&enPer(x,p)&&(!I.cat||catOf(x)===I.cat));

  const keyOf=x=>I.by==='cat'?catOf(x):I.by==='k'?(x.k||''):I.by==='e'?(x.e||''):x.c;
  for(const x of list){const key=keyOf(x);const v=toUYU(x.m,monOf(x.c));by[key]=(by[key]||0)+v;tot+=v}
  const rows=Object.entries(by).sort((a,b)=>b[1]-a[1]);const mx=rows.length?rows[0][1]:1;
  const name=k=>I.by==='e'?(k?'#'+k:'Sin etiqueta'):(k||'Sin concepto');
  const click=k=>I.by==='cat'?`V.inf.by='k';V.inf.cat=${js(k)};render()`:I.by==='k'?`filtrar({k:${js(I.tipo+'|'+k)}},'${p}')`:I.by==='e'?`filtrar({e:${js(k)},t:'${I.tipo}'},'${p}')`:`filtrar({c:${js(k)},t:'${I.tipo}'},'${p}')`;
  const end=p?(p.length===7?p:(p===hoy().slice(0,4)?ym(hoy()):p+'-12')):ym(hoy());
  const ms=[];for(let n=11;n>=0;n--)ms.push(perStep(end,-n));
  const ev=ms.map(m=>({m,...sumGI(movs().filter(x=>x.f.startsWith(m)))}));
  const emx=Math.max(1,...ev.map(e=>Math.max(e.g,e.i)));
  const segBy=[['cat','Categoría'],['k','Concepto'],['e','Etiqueta'],['c','Cuenta']].map(([k,l])=>`<button class="${I.by===k?'on':''}" onclick="V.inf.by='${k}';V.inf.cat='';render()">${l}</button>`).join('');

   <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
    ${pnav('V.inf.per',p)}
    <div class="seg"><button class="${p.length===7?'on':''}" onclick="V.inf.per=ym(hoy());render()">Mes</button><button class="${p.length===4?'on':''}" onclick="V.inf.per=hoy().slice(0,4);render()">Año</button><button class="${!p?'on':''}" onclick="V.inf.per='';render()">Todo</button></div>
   </div>
   <div class="filters">
    <div class="seg" style="flex:1 1 200px"><button class="${I.tipo==='G'?'on G':''}" onclick="V.inf.tipo='G';V.inf.cat='';render()">Gastos</button><button class="${I.tipo==='I'?'on I':''}" onclick="V.inf.tipo='I';V.inf.cat='';render()">Ingresos</button></div>
    <div class="seg" style="flex:1 1 300px">${segBy}</div>
   </div></div>
  <div class="card"><h2><span>${I.tipo==='G'?'Gastos':'Ingresos'} · ${h(perLabel(p))}${I.cat?' · '+h(I.cat):''}</span><span class="num" style="color:var(--tx)">${fmt(tot,'UYU')}</span></h2>
   ${I.cat?`<div style="margin-bottom:6px"><button class="btn sm" onclick="V.inf.cat='';V.inf.by='cat';render()">‹ Todas las categorías</button> <button class="btn sm" onclick="filtrar({cat:${js(I.cat)},t:'${I.tipo}'},'${p}')">Ver movimientos</button></div>`:''}
   ${rows.length?rows.map(([k,v])=>`<div style="padding:6px 0;cursor:pointer" onclick="${h(click(k))}"><div class="kv sm" style="padding:0"><span>${h(name(k))}</span><span class="num">${fmt(v,'UYU')} <span class="mu xs">${(v/tot*100).toFixed(1)}%</span></span></div><div class="bar ${I.tipo}"><i style="width:${(v/mx*100).toFixed(1)}%"></i></div></div>`).join(''):'<div class="empty">Sin datos para este período</div>'}
   <div class="xs mu" style="margin-top:8px">Montos en pesos; dólares convertidos a $ ${NF.format(cot())}.</div>
  </div>
  <div class="card"><h2>12 meses</h2>
   <div class="cols">${ev.map(e=>`<div class="c" title="${perLabel(e.m)}: ingresos ${fmt(e.i,'UYU')}, gastos ${fmt(e.g,'UYU')}" onclick="V.inf.per='${e.m}';render()"><div class="pair"><i style="height:${(e.i/emx*100).toFixed(1)}%;background:var(--verde)"></i><i style="height:${(e.g/emx*100).toFixed(1)}%;background:var(--rojo)"></i></div><span>${MES3[+e.m.slice(5)-1]}</span></div>`).join('')}</div>
   <div class="legend"><span><i style="background:var(--verde)"></i>Ingresos</span><span><i style="background:var(--rojo)"></i>Gastos</span></div>
   <div style="margin-top:10px">${ev.slice().reverse().map(e=>`<div class="kv sm"><span>${perLabel(e.m)}</span><span class="num"><span class="pos">${fmt(e.i,'UYU')}</span> · <span class="neg">${fmt(e.g,'UYU')}</span> · <b class="${e.i-e.g<0?'neg':'pos'}">${fmtS(e.i-e.g,'UYU')}</b></span></div>`).join('')}</div>
  </div>
  ${vPromedios()}

/* ---------- Comparación año a año ---------- */
const COL_AN=['#0f8a6c','#2f6fd6','#c27c0e','#8e44ad','#d23c3c','#5d6b82'];
function serieMes(ent,y,m){
  const mm=y+'-'+p2(m);let g=0,i=0;
  for(const x of S.movs){if(!x.f.startsWith(mm))continue;
    if(x.t==='G'){if(ent==='G*'||ent==='E*'||(ent.startsWith('C|')&&catOf(x)===ent.slice(2))||(ent.startsWith('K|')&&x.k===ent.slice(2)))g+=toUYU(x.m,monOf(x.c))}
    else if(x.t==='I'){if(ent==='I*'||ent==='E*'||(ent.startsWith('J|')&&x.k===ent.slice(2)))i+=toUYU(x.m,monOf(x.c))}}
  return ent==='E*'?i-g:(ent==='I*'||ent.startsWith('J|'))?i:g;
}
function vAnual(){
  const A=V.anual||(V.anual={ent:'G*',modo:'mes'});
  const hoyYM=ym(hoy()),yAct=+hoyYM.slice(0,4),mAct=+hoyYM.slice(5,7);
  const anios=[...new Set(S.movs.map(x=>+x.f.slice(0,4)))].filter(y=>y<=yAct).sort((a,b)=>b-a).slice(0,6);
  if(!anios.length)return '';
  const cats=[...new Set(S.movs.filter(x=>x.t==='G').map(catOf))].sort((a,b)=>a.localeCompare(b,'es'));
  const cIng=[...new Set(S.movs.filter(x=>x.t==='I').map(x=>x.k))].sort((a,b)=>a.localeCompare(b,'es'));
  const opts=[['I*','Ingresos (total)'],['G*','Gastos (total)'],['E*','Excedente (ingresos − gastos)']];
  const sel=`<select onchange="V.anual.ent=this.value;render()" style="max-width:100%">
    ${opts.map(([v,l])=>`<option value="${v}"${A.ent===v?' selected':''}>${l}</option>`).join('')}
    <optgroup label="Categorías de gastos">${cats.map(c=>`<option value="${h('C|'+c)}"${A.ent==='C|'+c?' selected':''}>${h(c)}</option>`).join('')}</optgroup>
    <optgroup label="Ingresos por concepto">${cIng.map(c=>`<option value="${h('J|'+c)}"${A.ent==='J|'+c?' selected':''}>${h(c)}</option>`).join('')}</optgroup></select>`;
  // series: una por año, 12 meses (el año en curso hasta el mes actual)
  const series=anios.map((y,ix)=>{const lim=y===yAct?mAct:12;let acc=0;
    const v=[];for(let m=1;m<=12;m++){if(m>lim){v.push(null);continue}const x=serieMes(A.ent,y,m);acc+=x;v.push(A.modo==='acum'?acc:x)}
    return {y,v,col:COL_AN[ix%COL_AN.length]}});
  const anual=A.modo==='anio';
  // vista por año: total de cada año (el actual: hasta hoy + proyección al cierre)
  const barras=anios.slice().reverse().map(y=>{const lim=y===yAct?mAct:12;let t=0;for(let m=1;m<=lim;m++)t+=serieMes(A.ent,y,m);
    return {y,t,proy:y===yAct&&lim<12?t/lim*12:t}});
  const todos=anual?barras.flatMap(b=>[b.t,b.proy]):series.flatMap(s=>s.v).filter(v=>v!=null);
  let mx=Math.max(0,...todos),mn=Math.min(0,...todos);if(mx===mn)mx=mn+1;
  const paso=(()=>{const r=(mx-mn)/4,p=Math.pow(10,Math.floor(Math.log10(r)));return [1,2,2.5,5,10].map(k=>k*p).find(k=>k>=r)})();
  mx=Math.ceil(mx/paso)*paso;mn=Math.floor(mn/paso)*paso;
  const chico=window.innerWidth<600,W=chico?360:640,H=chico?230:250,L=chico?40:58,R=8,T=18,B=24,X=m=>L+(m-1)*(W-L-R)/11,Y=v=>T+(mx-v)*(H-T-B)/(mx-mn);
  let grid='';for(let v=mn;v<=mx+0.001;v+=paso){grid+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--ln)" ${v===0?'stroke-width="1.5"':''}/><text x="${L-5}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--mu)">${abrev(v)}</text>`}
  const nb=barras.length,bw=Math.min(70,(W-L-R)/nb*0.55),BX=i=>L+(i+0.5)*(W-L-R)/nb;
  const ejeX=anual?barras.map((b,i)=>`<text x="${BX(i)}" y="${H-8}" text-anchor="middle" font-size="12" fill="var(--mu)">${b.y}</text>`).join('')
    :MES3.map((m,i)=>`<text x="${X(i+1)}" y="${H-6}" text-anchor="middle" font-size="${chico?10:11}" fill="var(--mu)">${chico?m.charAt(0).toUpperCase():m}</text>`).join('');
  const colAnio=y=>COL_AN[anios.indexOf(y)%COL_AN.length];
  const barrasSvg=!anual?'':barras.map((b,i)=>{const x=BX(i)-bw/2,y0=Y(0),yt=Y(b.t),yp=Y(b.proy),c=colAnio(b.y);
    const alto=Math.abs(y0-yt),altoP=Math.abs(yt-yp);
    return (b.proy!==b.t?`<rect x="${x}" y="${Math.min(yt,yp)}" width="${bw}" height="${altoP}" fill="${c}" opacity=".28" rx="3"><title>${b.y}: proyección al cierre ${fmt0(b.proy)}</title></rect>`:'')+
      `<rect x="${x}" y="${Math.min(y0,yt)}" width="${bw}" height="${Math.max(alto,1)}" fill="${c}" rx="3"><title>${b.y}: ${fmt0(b.t)}${b.proy!==b.t?' (hasta hoy)':''}</title></rect>`+
      `<text x="${BX(i)}" y="${Math.min(yt,yp)-6}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--tx)">${abrev(b.proy!==b.t?b.proy:b.t)}</text>`}).join('');
  const lineas=anual?barrasSvg:series.slice().reverse().map((s,ri)=>{const prin=s.y===anios[0];
    const pts=s.v.map((v,i)=>v==null?null:[X(i+1),Y(v),v,i]).filter(Boolean);
    if(!pts.length)return '';
    return `<polyline fill="none" stroke="${s.col}" stroke-width="${prin?3:2}" stroke-linejoin="round" stroke-linecap="round" opacity="${prin?1:.75}" points="${pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}"/>`+
      pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${prin?4:3}" fill="${s.col}"><title>${MESES[p[3]]} ${s.y}: ${fmt0(p[2])}</title></circle>`).join('')}).join('');
  // tabla: total, promedio y variación contra el mismo período del año anterior
  const tot=(y,hasta)=>{let t=0;for(let m=1;m<=hasta;m++)t+=serieMes(A.ent,y,m);return t};
  const filas=anios.map((y,ix)=>{const hasta=y===yAct?mAct:12,t=tot(y,hasta),prev=anios.includes(y-1)?tot(y-1,hasta):null;
    const vr=prev?((t-prev)/Math.abs(prev)*100):null;const malo=A.ent==='G*'||A.ent.startsWith('C|')?vr>0:vr<0;
    return `<tr><td><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${series[ix].col};margin-right:6px"></span>${y}${y===yAct?` <span class="xs mu">(ene–${MES3[mAct-1]})</span>`:''}</td>
      <td class="num">${fmt0(t)}</td><td class="num disp">${fmt0(t/hasta)}</td><td class="num ${vr==null?'mu':malo?'neg':'pos'}">${vr==null?'—':(vr>0?'+':'')+Math.round(vr)+'%'}</td></tr>`}).join('');
  return `<div class="card"><h2>Comparación año a año</h2>
   <div class="filters" style="margin-top:0">${sel}
    <div class="seg" style="flex:0 0 auto"><button class="${A.modo==='mes'?'on':''}" onclick="V.anual.modo='mes';render()">Por mes</button><button class="${A.modo==='acum'?'on':''}" onclick="V.anual.modo='acum';render()">Acumulado</button><button class="${A.modo==='anio'?'on':''}" onclick="V.anual.modo='anio';render()">Por año</button></div></div>
   <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;margin-top:10px" role="img" aria-label="Evolución por año">${grid}${ejeX}${lineas}</svg>
   ${anual?(barras.some(b=>b.proy!==b.t)?`<div class="legend"><span><i style="background:${COL_AN[0]}"></i>Hasta hoy</span><span><i style="background:${COL_AN[0]};opacity:.28"></i>Proyección al cierre (promedio de los meses transcurridos)</span></div>`:''):`<div class="legend" style="flex-wrap:wrap">${series.map(s=>`<span><i style="background:${s.col}"></i>${s.y}</span>`).join('')}</div>`}
   <table class="pr" style="margin-top:10px"><tr><th>Año</th><th>Total</th><th class="disp">Prom. mensual</th><th>Variación</th></tr>${filas}</table>
   <div class="xs mu" style="margin-top:8px">La variación compara contra el mismo período del año anterior${anios.length<2?' (por ahora hay datos de un solo año: la comparación aparece cuando haya dos)':''}. Pasá el dedo o el mouse por un punto para ver el monto.</div>
  </div>`;
}
function abrev(v){const a=Math.abs(v);const s=v<0?'−':'';return a>=1e6?s+(a/1e6).toFixed(a%1e6?1:0)+'M':a>=1e3?s+Math.round(a/1e3)+'k':s+Math.round(a)}

/* ---------- Promedios mensuales del año ---------- */
function vPromedios(){
  const A=V.prom||(V.prom={y:hoy().slice(0,4),actual:false,abiertas:{}});
  const hoyYM=ym(hoy()),y=A.y,esActual=y===hoyYM.slice(0,4);
  // meses que se promedian: año pasado → 12; año en curso → meses completos (o hasta el actual)
  const ult=esActual?(A.actual?+hoyYM.slice(5,7):+hoyYM.slice(5,7)-1):12;
  const n=Math.max(ult,0);
  const hasta=y+'-'+p2(Math.max(n,1));
  const list=S.movs.filter(x=>x.f.startsWith(y)&&x.f.slice(0,7)<=hasta&&(x.t==='G'||x.t==='I'));
  const ing={},gas={};let TI=0,TG=0;
  for(const x of list){const v=toUYU(x.m,monOf(x.c));
    if(x.t==='I'){ing[x.k]=(ing[x.k]||0)+v;TI+=v}
    else{const cat=catOf(x);(gas[cat]||(gas[cat]={t:0,k:{}})).t+=v;gas[cat].k[x.k]=(gas[cat].k[x.k]||0)+v;TG+=v}}
  const pm=v=>n?v/n:0;
  const filasG=Object.entries(gas).sort((a,b)=>b[1].t-a[1].t).map(([cat,o])=>{
    const ab=A.abiertas[cat];
    return `<tr class="cat1" onclick="V.prom.abiertas[${js(cat)}]=!V.prom.abiertas[${js(cat)}];render()"><td>${ab?'▾':'▸'} ${h(cat)}</td><td class="num"><b>${fmt0(pm(o.t))}</b></td><td class="num disp">${fmt0(o.t)}</td><td class="num">${TG?Math.round(o.t/TG*100):0}%</td></tr>`+
      (ab?Object.entries(o.k).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr class="sub" onclick="filtrar({k:${js('G|'+k)}},'${y}')"><td>${h(k)}</td><td class="num">${fmt0(pm(v))}</td><td class="num disp">${fmt0(v)}</td><td class="num mu">${TG?Math.round(v/TG*100):0}%</td></tr>`).join(''):'');
  }).join('');
  const filasI=Object.entries(ing).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr class="sub" onclick="filtrar({k:${js('I|'+k)}},'${y}')"><td>${h(k)}</td><td class="num">${fmt0(pm(v))}</td><td class="num disp">${fmt0(v)}</td><td class="num mu">${TI?Math.round(v/TI*100):0}%</td></tr>`).join('');
  const exc=pm(TI-TG);
  return `<div class="card"><h2>Promedios mensuales</h2>
   <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
    <div class="pnav"><button onclick="V.prom.y=String(+V.prom.y-1);render()">‹</button><b>Año ${h(y)}</b><button onclick="V.prom.y=String(+V.prom.y+1);render()">›</button></div>
    ${esActual?`<div class="seg"><button class="${!A.actual?'on':''}" onclick="V.prom.actual=false;render()">Meses completos</button><button class="${A.actual?'on':''}" onclick="V.prom.actual=true;render()">Con el mes actual</button></div>`:''}
   </div>
   <div class="xs mu" style="margin:8px 0">${n?`Promedio sobre <b>${n} ${n===1?'mes':'meses'}</b> (enero a ${MESES[n-1]} ${h(y)}).`:'Todavía no hay meses completos este año: elegí “Con el mes actual”.'} Tocá una categoría para ver sus conceptos.</div>
   ${n&&list.length?`<div class="resumen"><div><div class="xs mu">Ingresos por mes</div><b class="num pos">${fmt0(pm(TI))}</b></div><div><div class="xs mu">Gastos por mes</div><b class="num neg">${fmt0(pm(TG))}</b></div>
     <div><div class="xs mu">Excedente por mes</div><b class="num ${exc<0?'neg':'pos'}" style="font-size:20px">${fmt0(exc)}</b></div><div><div class="xs mu">Excedente del período</div><b class="num ${TI-TG<0?'neg':''}">${fmt0(TI-TG)}</b></div></div>
   <table class="pr"><tr><th>Ingresos</th><th>Por mes</th><th class="disp">Total</th><th>%</th></tr>
    ${filasI||'<tr><td colspan="4" class="mu">Sin ingresos</td></tr>'}
    <tr class="cat"><td>Total ingresos</td><td class="num">${fmt0(pm(TI))}</td><td class="num disp">${fmt0(TI)}</td><td></td></tr></table>
   <table class="pr" style="margin-top:14px"><tr><th>Gastos por categoría</th><th>Por mes</th><th class="disp">Total</th><th>%</th></tr>
    ${filasG||'<tr><td colspan="4" class="mu">Sin gastos</td></tr>'}
    <tr class="cat"><td>Total gastos</td><td class="num">${fmt0(pm(TG))}</td><td class="num disp">${fmt0(TG)}</td><td></td></tr></table>`
   :'<div class="empty">Sin datos para ese año.</div>'}
   <div class="xs mu" style="margin-top:8px">En pesos; dólares a $ ${NF.format(cot())}. No incluye transferencias entre cuentas ni ajustes de saldo.</div>
  </div>`;
}

let _editCon=null;
function openConcepto(tipo,n){
  _editCon=n?{tipo,n}:{tipo,n:null};
  const c=n?con(tipo,n):{n:'',tipo,cat:''};
  const cats=[...new Set(S.cfg.conceptos.map(x=>x.cat).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'es'));
  modal(`<h3>${n?'Editar concepto':'Nuevo concepto'} de ${tipo==='I'?'ingreso':'gasto'}</h3><form onsubmit="event.preventDefault();saveConcepto()">
  <div class="fld"><label>Nombre</label><input type="text" id="co_n" value="${h(c.n)}" required></div>
  <div class="fld"><label>Categoría</label><input type="text" id="co_c" list="dl_cats" value="${h(c.cat||'')}" autocomplete="off"><datalist id="dl_cats">${cats.map(x=>`<option value="${h(x)}">`).join('')}</datalist></div>
  ${n?`<div class="fld"><label>Pasar sus movimientos a otro concepto y eliminar este</label><select id="co_mv"><option value="">— no —</option>${sortN(S.cfg.conceptos.filter(x=>x.tipo===tipo&&x.n!==n)).map(x=>`<option value="${h(x.n)}">${h(x.n)}</option>`).join('')}</select></div>`:''}
  <div class="btns" style="justify-content:flex-end"><button type="button" class="btn" onclick="closeModal()">Cancelar</button><button class="btn pri">Guardar</button></div></form>`);
  setTimeout(()=>document.getElementById('co_n').focus(),50);
}
function saveConcepto(){
  const {tipo,n:old}=_editCon;
  const n=document.getElementById('co_n').value.trim(),cat=document.getElementById('co_c').value.trim();if(!n)return;
  const mv=old?document.getElementById('co_mv').value:'';
  const ren={};
  if(!mv&&n!==old&&con(tipo,n)){toast('Ya existe ese concepto');return}
  if(old){
    const to=mv||n;
    if(to!==old){ren.k={[tipo+'|'+old]:to};for(const x of S.movs)if(x.t===tipo&&x.k===old)x.k=to;(S.extras||[]).forEach(e=>{if(e.k===old&&(e.t||'G')===tipo)e.k=to})}
    if(mv)S.cfg.conceptos=S.cfg.conceptos.filter(c=>!(c.tipo===tipo&&c.n===old));
    else Object.assign(con(tipo,old),{n,cat});
  }else S.cfg.conceptos.push({n,tipo,cat});
  invalidate();saveCfg(ren);closeModal();render();toast('Concepto guardado');
}
function borrarTodo(){
  confirmar('Se borran todas las cuentas, conceptos y movimientos del Google Sheet. ¿Seguro?',()=>{
    S.movs=[];S.cfg.cuentas=[];S.cfg.conceptos=[];invalidate();op('borrarTodo');closeModal();render();toast('Datos borrados')});
}

function ncTipo(id,t){
  const el=document.getElementById('nc_'+id);
  el.querySelectorAll('.seg button').forEach(b=>b.className=b.dataset.k===t?'on '+t:'');
  el.querySelector('.nc_c2w').hidden=t!=='T';el.querySelector('.nc_kw').hidden=t==='T';el.querySelector('.nc_nw').hidden=t!=='G';
  el.querySelector('.nc_cl').textContent=t==='T'?'Desde':'Cuenta';
  const k=el.querySelector('.nc_k');
  if(t!=='T'&&k.dataset.tipo!==t){const tmp=document.createElement('div');const n=S.notifs.pend.find(x=>x.id===id);tmp.innerHTML=cardNotif({...n,tipo:t,concepto:''});k.innerHTML=tmp.querySelector('.nc_k').innerHTML;k.dataset.tipo=t}
  el.dataset.t=t;
}
async function asignar(id){
  const el=document.getElementById('nc_'+id),n=S.notifs.pend.find(x=>x.id===id);
  const q=c=>el.querySelector(c);
  const t=el.dataset.t||(['G','I','T'].includes(n.tipo)?n.tipo:'G');
  const m=Math.abs(parseNum(q('.nc_m').value)),c=q('.nc_c').value,c2=q('.nc_c2').value,k=q('.nc_k').value,d=q('.nc_d').value.trim(),f=q('.nc_f').value||hoy();
  if(!(m>0)){toast('Ingresá el importe');return}
  if(!c){toast('Elegí la cuenta');return}
  if(t==='T'&&(!c2||c2===c)){toast('Elegí la cuenta de destino');return}
  if(t!=='T'&&!k){toast('Elegí el concepto');return}
  const mov={id:'m'+id.slice(1),t,f,c,m:r2(m),ts:Date.now()};
  if(t==='T'){mov.c2=c2;if(monOf(c)!==monOf(c2)){toast('Para transferencias entre monedas, cargala desde Movimientos');return}}else mov.k=k;
  if(d)mov.d=d;
  const reglas=[];
  if(t!=='T'&&q('.nc_rk').checked&&q('.nc_pk').value.trim())reglas.push({tipo:'Concepto',palabra:q('.nc_pk').value.trim(),valor:k});
  if(q('.nc_rc').checked)reglas.push({tipo:'Cuenta',palabra:n.digitos||'',app:n.digitos?'':sinCanal(n.app),valor:c});
  S.movs=S.movs.filter(x=>x.id!==mov.id);
  const N=t==='G'?Math.max(1,Math.min(60,parseInt(q('.nc_n').value)||1)):1;
  if(N>1){const cs=crearCuotas(mov,N,mov.m);S.movs.push(...cs);op('importMovs',JSON.stringify(cs)).catch(()=>{});mov.id=cs[0].id}else S.movs.push(mov);
  const movN=N>1?null:mov;
  S.notifs.pend=S.notifs.pend.filter(x=>x.id!==id);S.notifs.rec.unshift({...n,estado:'asignada',cuenta:c,concepto:k||'Transferencia'});
  reglas.forEach(r=>{S.reglas=S.reglas.filter(x=>!(x.tipo===r.tipo&&norm(x.palabra)===norm(r.palabra)&&norm(x.app||'')===norm(r.app||'')));S.reglas.push(r)});
  invalidate();render();toast('Guardado');
  await op('asignarNotif',JSON.stringify({id,mov:movN||S.movs.find(x=>x.id===mov.id),reglas})).catch(()=>{});
  if(reglas.length&&S.notifs.pend.length)reprocesar(true);
}
async function estadoNotif(id,estado){
  const all=[...S.notifs.pend,...S.notifs.rec];const n=all.find(x=>x.id===id);if(!n)return;
  S.notifs.pend=S.notifs.pend.filter(x=>x.id!==id);S.notifs.rec=S.notifs.rec.filter(x=>x.id!==id);
  n.estado=estado;if(estado==='pendiente')S.notifs.pend.push(n);else if(estado!=='descartada')S.notifs.rec.unshift(n);
  render();if(estado==='descartada')toast('Descartado');
  await op('estadoNotif',id,estado).catch(()=>{});
}
async function borrarNotif(id){
  S.notifs.pend=S.notifs.pend.filter(x=>x.id!==id);S.notifs.rec=S.notifs.rec.filter(x=>x.id!==id);S.notifs.cuotas=S.notifs.cuotas.filter(x=>x.id!==id);
  render();toast('Borrado');await op('borrarNotif',id).catch(()=>{});
}
async function reprocesar(silencioso){
  const k=await op('reprocesar').catch(()=>null);
  if(k){toast(`Se asignaron ${k} más con las reglas nuevas`);load()}else if(!silencioso)toast('Ninguna coincide todavía con las reglas');
}

/* ---------- Presupuesto ---------- */
function sem(p){p=Math.round(p);return p<=75?'v':p<=100?'a':'r'}
/* en ingresos el semáforo va al revés: llegar al 100% es lo bueno */
function semT(p,t){if(t!=='I')return sem(p);p=Math.round(p);return p>=100?'v':p>=75?'a':'r'}
function pctTxt(gas,pres){if(!pres)return '';const p=gas/pres*100;return `<span class="tx-${sem(p)}">${Math.round(p)}%</span>`}
function extrasMes(k,ymx,t){const y=+ymx.slice(0,4),m=+ymx.slice(5,7);t=t||'G';return (S.extras||[]).filter(x=>x.k===k&&(x.t||'G')===t&&x.mes===m&&(!x.anio||x.anio===y))}
function presMes(c,ymx){return (c.pres||0)+extrasMes(c.n,ymx,c.tipo).reduce((s,x)=>s+x.m,0)}
function presPeriodo(c,P){const y=P.per.slice(0,4),n=P.modo==='mes'?null:P.modo==='corriente'?+P.per.slice(5,7):12;
  if(!n)return presMes(c,P.per);let t=0;for(let i=1;i<=n;i++)t+=presMes(c,y+'-'+p2(i));return t}
function movConcepto(t,filtro){const r={};for(const x of S.movs)if(x.t===t&&filtro(x)){r[x.k]=(r[x.k]||0)+toUYU(x.m,monOf(x.c))}return r}
function gastosConcepto(filtro){return movConcepto('G',filtro)}
function presResumen(mes){
  const g=gastosConcepto(x=>x.f.startsWith(mes));let pres=0,gas=0;
  for(const c of S.cfg.conceptos){if(c.tipo!=='G')continue;const p=presMes(c,mes);if(p>0){pres+=p;gas+=g[c.n]||0}}
  return {pres,gas};
}
function fmt0(v){const r=Math.round(v);return (r<0?'−':'')+'$ '+Math.abs(r).toLocaleString('es-UY')}
function pctCelda(g,p,t){if(!p)return '<td class="pct mu">—</td>';const x=g/p*100;return `<td class="pct tx-${semT(x,t)}">${Math.round(x)}%</td>`}
function vPresupuesto(){
  const P=V.pres||(V.pres={per:ym(hoy()),modo:'mes',edit:false,tipo:'G'});
  P.tipo=P.tipo||'G';
  const y=P.per.slice(0,4),mesN=+P.per.slice(5,7),t=P.tipo;
  const tabs=`<div class="seg" style="margin-bottom:12px">${[['G','Gastos'],['I','Ingresos'],['R','Excedente']].map(([k,l])=>`<button class="${t===k?'on '+(k==='R'?'':k):''}" onclick="V.pres.tipo='${k}';V.pres.edit=false;render()">${l}</button>`).join('')}</div>`;
  if(t==='R')return tabs+vExcedente(P);
  const fil=P.modo==='mes'?(x=>x.f.startsWith(P.per)):P.modo==='corriente'?(x=>x.f.startsWith(y)&&x.f.slice(0,7)<=P.per):(x=>x.f.startsWith(y));
  const gas=movConcepto(t,fil);
  const per=P.modo==='mes'?P.per:y;
  const G=t==='G';
  const cab=`${tabs}<div class="card">
   <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
    ${pnav('V.pres.per',P.per)}
    <div class="seg">${[['mes','Mes'],['corriente','Al corriente'],['anio','Año']].map(([k,l])=>`<button class="${P.modo===k?'on':''}" onclick="V.pres.modo='${k}';render()">${l}</button>`).join('')}</div>
   </div>
   <div class="xs mu" style="margin-top:8px">${P.modo==='mes'?(G?'Gastos':'Ingresos')+' del mes contra lo presupuestado.':P.modo==='corriente'?`De enero a ${MESES[mesN-1]}.`:`Todo ${y}.`}
    ${G?'Avance: <b class="tx-v">verde</b> hasta 75% · <b class="tx-a">amarillo</b> 76–100% · <b class="tx-r">rojo</b> más de 100%.':'Cobrado: <b class="tx-v">verde</b> 100% o más · <b class="tx-a">amarillo</b> 75–99% · <b class="tx-r">rojo</b> menos de 75%.'}</div>
  </div>`;
  if(P.edit){
    const cats={};for(const c of S.cfg.conceptos.filter(c=>c.tipo===t))(cats[c.cat||'Sin categoría']||(cats[c.cat||'Sin categoría']=[])).push(c);
    return cab+`<div class="card"><h2>${G?'Gasto':'Ingreso'} mensual previsto por concepto</h2>
     <p class="sm mu" style="margin-top:0">${G?'Poné cuánto querés gastar por mes en cada concepto':'Poné cuánto esperás cobrar por mes en cada concepto (sueldo, alquileres…)'} en pesos. Dejalo vacío si no lo querés controlar.</p>
     <table class="pr ed">${Object.keys(cats).sort((a,b)=>a.localeCompare(b,'es')).map(cat=>`<tr class="cat"><td colspan="2">${h(cat)}</td></tr>`+sortN(cats[cat]).map(c=>`<tr><td>${h(c.n)}</td><td><input type="text" inputmode="decimal" data-con="${h(c.n)}" value="${c.pres?String(c.pres).replace('.',','):''}" placeholder="0"></td></tr>`).join('')).join('')||'<tr><td class="empty">No hay conceptos de este tipo. Agregalos en Ajustes.</td></tr>'}</table>
     <div class="btns" style="justify-content:flex-end;margin-top:10px"><button class="btn" onclick="V.pres.edit=false;render()">Cancelar</button><button class="btn pri" onclick="guardarPres('${t}')">Guardar</button></div></div>`+vExtras(P)+vFijos(t);
  }
  const cats={},sin=[];
  for(const c of S.cfg.conceptos.filter(c=>c.tipo===t)){
    const g=gas[c.n]||0,pp=presPeriodo(c,P);
    if(pp>0)(cats[c.cat||'Sin categoría']||(cats[c.cat||'Sin categoría']=[])).push({c,g,p:pp,ex:P.modo==='mes'?extrasMes(c.n,P.per,t):[]});
    else if(g>0.5)sin.push({c,g});
  }
  let TP=0,TG=0,filas='';
  for(const cat of Object.keys(cats).sort((a,b)=>a.localeCompare(b,'es'))){
    const L=cats[cat].sort((a,b)=>b.p-a.p);
    const cp=L.reduce((s,r)=>s+r.p,0),cg=L.reduce((s,r)=>s+r.g,0);TP+=cp;TG+=cg;
    const dif=v=>G?v:-v;
    if(L.length>1)filas+=`<tr class="cat"><td>${h(cat)}</td><td class="num">${fmt0(cp)}</td><td class="num">${fmt0(cg)}</td>${pctCelda(cg,cp,t)}<td class="disp num ${dif(cp-cg)<0&&G?'neg':''}">${fmt0(cp-cg)}</td></tr>`;
    for(const r of L)filas+=`<tr class="${L.length>1?'sub':'cat1'}" onclick="filtrar({k:${js(t+'|'+r.c.n)}},'${per}')"><td>${h(r.c.n)}${L.length===1&&norm(cat)!==norm(r.c.n)?`<div class="xs mu">${h(cat)}</div>`:''}${r.ex.length?`<div class="xs mu">incluye ${r.ex.map(x=>h(x.n)).join(', ')}</div>`:''}</td>
      <td class="num">${fmt0(r.p)}</td><td class="num">${fmt0(r.g)}</td>${pctCelda(r.g,r.p,t)}<td class="disp num ${G&&r.p-r.g<0?'neg':''}">${fmt0(r.p-r.g)}</td></tr>`;
  }
  const totSin=sin.reduce((s,r)=>s+r.g,0);
  const L1=G?['Presupuesto','Gastado','Disponible']:['Previsto','Cobrado','Falta cobrar'];
  return cab+`<div class="card">
   <h2>${G?'Ejecución del presupuesto':'Ingresos previstos y cobrados'} <button class="btn sm" onclick="V.pres.edit=true;render()">Editar</button></h2>
   ${TP?`<div class="resumen"><div><div class="xs mu">${L1[0]}</div><b class="num">${fmt0(TP)}</b></div><div><div class="xs mu">${L1[1]}</div><b class="num">${fmt0(TG)}</b></div>
     <div><div class="xs mu">Avance</div><b class="num tx-${semT(TG/TP*100,t)}" style="font-size:20px">${Math.round(TG/TP*100)}%</b></div><div><div class="xs mu">${L1[2]}</div><b class="num ${G&&TP-TG<0?'neg':''}">${fmt0(G?TP-TG:Math.max(0,TP-TG))}</b></div></div>
   <table class="pr"><tr><th>Concepto</th><th>${G?'Presup.':'Previsto'}</th><th>${G?'Gastado':'Cobrado'}</th><th>%</th><th class="disp">${G?'Disponible':'Diferencia'}</th></tr>${filas}</table>`
   :`<div class="empty">Todavía no cargaste ${G?'presupuestos de gastos':'ingresos previstos'}.<br><button class="btn pri" style="margin-top:10px" onclick="V.pres.edit=true;render()">${G?'Cargar presupuestos':'Cargar ingresos previstos'}</button></div>`}
   ${sin.length?`<details class="sinp"><summary><span>${G?'Gastos':'Ingresos'} sin presupuesto (${sin.length})</span><b class="num">${fmt0(totSin)}</b></summary>
     <table class="pr">${sin.sort((a,b)=>b.g-a.g).map(r=>`<tr class="sub" onclick="filtrar({k:${js(t+'|'+r.c.n)}},'${per}')"><td>${h(r.c.n)}<div class="xs mu">${h(r.c.cat||'')}</div></td><td class="num">${fmt0(r.g)}</td></tr>`).join('')}</table></details>`:''}
   <div class="xs mu" style="margin-top:8px">En pesos; dólares a $ ${NF.format(cot())}. Tocá un concepto para ver sus movimientos.</div>
  </div>
  ${vExtras(P)}
  ${vFijos(t)}`;
}
/* ---------- Excedente: ingresos previstos − gastos previstos, mes a mes ---------- */
function vExcedente(P){
  const y=P.per.slice(0,4),actual=ym(hoy());
  const CG=S.cfg.conceptos.filter(c=>c.tipo==='G'),CI=S.cfg.conceptos.filter(c=>c.tipo==='I');
  let T={pi:0,pg:0,ri:0,rg:0,proy:0},filas='',hayPres=false;
  for(let m=1;m<=12;m++){
    const mm=y+'-'+p2(m);
    const pi=CI.reduce((s,c)=>s+presMes(c,mm),0),pg=CG.reduce((s,c)=>s+presMes(c,mm),0);
    const {g:rg,i:ri}=sumGI(S.movs.filter(x=>x.f.startsWith(mm)));
    const pasado=mm<actual,esActual=mm===actual,futuro=mm>actual;
    if(pi||pg)hayPres=true;
    T.pi+=pi;T.pg+=pg;if(!futuro){T.ri+=ri;T.rg+=rg}
    T.proy+=pasado?(ri-rg):esActual?Math.max(pi,ri)-Math.max(pg,rg):(pi-pg);
    const ep=pi-pg,er=ri-rg;
    filas+=`<tr class="${esActual?'cat':''}" onclick="V.pres.per='${mm}';V.pres.modo='mes';V.pres.tipo='G';render()"><td>${MESES[m-1].charAt(0).toUpperCase()+MESES[m-1].slice(1)}${esActual?' <span class="chip">hoy</span>':''}</td>
      <td class="num disp">${fmt0(pi)}</td><td class="num disp">${fmt0(pg)}</td><td class="num ${ep<0?'neg':'pos'}"><b>${fmt0(ep)}</b></td>
      <td class="num ${futuro?'mu':er<0?'neg':'pos'}">${futuro?'—':fmt0(er)}</td></tr>`;
  }
  const exP=T.pi-T.pg,exR=T.ri-T.rg;
  const sinPresG=sumGI(S.movs.filter(x=>x.f.startsWith(y)&&x.t==='G'&&!(con('G',x.k)&&presMes(con('G',x.k),x.f.slice(0,7))>0))).g;
  return `<div class="card">
   <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
    <div class="pnav"><button onclick="V.pres.per=perStep(V.pres.per.slice(0,4),-1)+'-12';render()">‹</button><b>Año ${y}</b><button onclick="V.pres.per=perStep(V.pres.per.slice(0,4),1)+'-01';render()">›</button></div>
   </div>
   <div class="resumen" style="margin-top:12px"><div><div class="xs mu">Ingresos previstos</div><b class="num">${fmt0(T.pi)}</b></div><div><div class="xs mu">Gastos previstos</div><b class="num">${fmt0(T.pg)}</b></div>
    <div><div class="xs mu">Excedente previsto</div><b class="num ${exP<0?'neg':'pos'}" style="font-size:20px">${fmt0(exP)}</b></div>
    <div><div class="xs mu">${y===actual.slice(0,4)?'Proyección al cierre':'Excedente real'}</div><b class="num ${(y===actual.slice(0,4)?T.proy:exR)<0?'neg':'pos'}" style="font-size:20px">${fmt0(y===actual.slice(0,4)?T.proy:exR)}</b></div></div>
   ${y===actual.slice(0,4)?`<div class="sm" style="margin-bottom:8px">Excedente real hasta hoy: <b class="num ${exR<0?'neg':'pos'}">${fmt0(exR)}</b> <span class="mu xs">(ingresos ${fmt0(T.ri)} − gastos ${fmt0(T.rg)})</span></div>`:''}
   ${hayPres?`<table class="pr"><tr><th>Mes</th><th class="disp">Ingresos prev.</th><th class="disp">Gastos prev.</th><th>Excedente prev.</th><th>Excedente real</th></tr>${filas}
     <tr class="cat"><td>Total</td><td class="num disp">${fmt0(T.pi)}</td><td class="num disp">${fmt0(T.pg)}</td><td class="num ${exP<0?'neg':''}">${fmt0(exP)}</td><td class="num ${exR<0?'neg':''}">${fmt0(exR)}</td></tr></table>`
   :`<div class="empty">Cargá los ingresos previstos (pestaña Ingresos) y el presupuesto de gastos (pestaña Gastos) para ver el excedente del año.</div>`}
   <div class="xs mu" style="margin-top:8px">El previsto incluye los montos mensuales y los anuales (aguinaldo, patente…). El real incluye todos los movimientos.
    ${sinPresG>0.5?` Este año hay <b>${fmt0(sinPresG)}</b> de gastos en conceptos sin presupuesto: si se repiten, conviene presupuestarlos para que el excedente previsto sea realista.`:''}
    La proyección suma lo real de los meses pasados y lo previsto de los que faltan.</div>
  </div>`;
}
function vExtras(P){
  const t=P.tipo==='I'?'I':'G',G=t==='G';
  const L=[...(S.extras||[])].filter(x=>(x.t||'G')===t).sort((a,b)=>a.mes-b.mes||a.n.localeCompare(b.n,'es'));
  const y=+P.per.slice(0,4);
  const tot=L.filter(x=>!x.anio||x.anio===y).reduce((s,x)=>s+x.m,0);
  return `<div class="card"><h2>${G?'Gastos':'Ingresos'} anuales previstos <button class="btn sm" onclick="openExtra(null,'${t}')">+ Agregar</button></h2>
   <p class="xs mu" style="margin-top:0">${G?'Gastos grandes que caen una vez al año en un mes fijo (patente, contribución, escolaridad…).':'Ingresos que llegan en meses fijos (aguinaldo en junio y diciembre, salario vacacional…).'} Ese mes se suman a lo previsto de su concepto.</p>
   ${L.length?L.map(x=>`<div class="row" onclick="openExtra(${js(x.id)})"><div class="ico ${t}" style="font-size:11px">${MES3[x.mes-1]}</div><div class="mid"><div class="t1">${h(x.n)}</div>
     <div class="t2">${h(x.k)} · ${x.anio?'solo '+x.anio:'todos los años'} · ${MESES[x.mes-1]}</div></div><div class="num">${fmt(x.m,'UYU')}</div></div>`).join('')
     +`<div class="kv" style="margin-top:6px"><b>Total previsto ${y}</b><b class="num">${fmt(tot,'UYU')}</b></div>`:'<div class="empty">Todavía no cargaste ninguno.</div>'}
  </div>`;
}
function openExtra(id,tipo){
  const x=id?S.extras.find(e=>e.id===id):{n:'',k:'',mes:+hoy().slice(5,7),anio:0,m:'',t:tipo||'G'};
  const t=x.t||'G',G=t==='G';
  const conc=sortN(S.cfg.conceptos.filter(c=>c.tipo===t));
  modal(`<h3>${id?'Editar':'Nuevo'} ${G?'gasto':'ingreso'} anual previsto</h3><form onsubmit="event.preventDefault();guardarExtra(${js(id||'')},'${t}')">
   <div class="fld"><label>Nombre</label><input type="text" id="ex_n" value="${h(x.n)}" placeholder="${G?'Ej. Patente del auto, Contribución, Escolaridad':'Ej. Aguinaldo, Salario vacacional'}" required></div>
   <div class="fld2"><div class="fld"><label>Mes</label><select id="ex_mes">${MESES.map((m,i)=>`<option value="${i+1}"${i+1===x.mes?' selected':''}>${m}</option>`).join('')}</select></div>
   <div class="fld"><label>Monto ($)</label><input type="text" inputmode="decimal" id="ex_m" value="${x.m?String(x.m).replace('.',','):''}" required></div></div>
   <div class="fld"><label>Concepto</label><input type="text" id="ex_k" list="dl_exk" value="${h(x.k)}" placeholder="Elegí o escribí uno nuevo" autocomplete="off" required>
    <datalist id="dl_exk">${conc.map(c=>`<option value="${h(c.n)}">`).join('')}</datalist>
    <div class="xs mu" style="margin-top:3px">Si escribís un concepto que no existe (ej. “${G?'Escolaridad':'Aguinaldo'}”), se crea en la categoría “${G?'Gastos':'Ingresos'} anuales”.</div></div>
   <div class="fld"><label>Se repite</label><select id="ex_a"><option value="0"${!x.anio?' selected':''}>Todos los años</option>${[0,1,2].map(d=>{const a=+hoy().slice(0,4)+d;return `<option value="${a}"${x.anio===a?' selected':''}>Solo en ${a}</option>`}).join('')}</select></div>
   <div class="btns" style="justify-content:space-between"><div>${id?`<button type="button" class="btn dan" onclick="borrarExtra(${js(id)})">Eliminar</button>`:''}</div>
   <div class="btns"><button type="button" class="btn" onclick="closeModal()">Cancelar</button><button class="btn pri">Guardar</button></div></div></form>`);
  setTimeout(()=>document.getElementById('ex_n').focus(),50);
}
function guardarExtra(id,t){
  t=t||'G';
  const g=i=>document.getElementById(i).value;
  const x={id:id||uid(),n:g('ex_n').trim(),k:g('ex_k').trim(),mes:+g('ex_mes'),anio:+g('ex_a')||0,m:r2(Math.abs(parseNum(g('ex_m')))),t};
  if(!x.n||!x.k||!(x.m>0)){toast('Completá nombre, concepto y monto');return}
  const ex=S.cfg.conceptos.find(c=>c.tipo===t&&norm(c.n)===norm(x.k));
  if(ex)x.k=ex.n;else{S.cfg.conceptos.push({n:x.k,tipo:t,cat:t==='G'?'Gastos anuales':'Ingresos anuales'});invalidate();saveCfg()}
  S.extras=(S.extras||[]).filter(e=>e.id!==x.id);S.extras.push(x);
  op('saveExtras',JSON.stringify(S.extras)).catch(()=>{});closeModal();render();toast('Guardado');
}
function borrarExtra(id){confirmar('¿Eliminar este monto anual previsto?',()=>{S.extras=S.extras.filter(e=>e.id!==id);op('saveExtras',JSON.stringify(S.extras)).catch(()=>{});closeModal();render()})}
function dispTxt(v){return `<span class="num ${v<0?'neg':''}">${fmtS(v,'UYU')}</span>`}
function guardarPres(t){
  t=t||'G';
  document.querySelectorAll('input[data-con]').forEach(i=>{const c=con(t,i.dataset.con);if(c)c.pres=r2(parseNum(i.value)||0)});
  V.pres.edit=false;saveCfg();render();toast('Guardado');
}

/* ---------- Gastos fijos ---------- */
function vFijos(t){
  t=t||'G';const G=t==='G';
  const L=S.fijos.filter(f=>f.t===t);
  return `<div class="card"><h2>${G?'Gastos fijos mensuales':'Ingresos fijos mensuales'} <button class="btn sm" onclick="openFijo(null,'${t}')">+ Agregar</button></h2>
   <p class="xs mu" style="margin-top:0">${G?'Hipoteca, ANTEL, UTE, colegio…':'Sueldo, alquileres…'} Cada mes se crea solo el movimiento en el día indicado (aparece como “futuro” hasta esa fecha). Si un mes cambia el importe, editá ese movimiento.</p>
   ${L.length?L.map(f=>`<div class="row" onclick="openFijo(${js(f.id)})"><div class="ico ${f.t}">${f.t==='I'?'+':'⟳'}</div><div class="mid"><div class="t1">${h(f.n)}${f.activo?'':'<span class="chip" style="background:var(--bg);color:var(--mu)">pausado</span>'}</div>
     <div class="t2">Día ${f.dia} · ${h(f.k)} · ${h(f.c)} · desde ${h(perLabel(f.desde))}${f.hasta?' hasta '+h(perLabel(f.hasta)):''}</div></div><div class="num ${f.t==='I'?'pos':'neg'}">${fmt(f.m,monOf(f.c))}</div></div>`).join(''):`<div class="empty">${G?'Todavía no cargaste gastos fijos.':'Todavía no cargaste ingresos fijos.'}</div>`}
  </div>`;
}
function openFijo(id,tipo){
  const f=id?S.fijos.find(x=>x.id===id):{n:'',t:tipo||'G',c:(S.cfg.cuentas.find(c=>!c.arch)||{}).n||'',k:'',m:'',dia:1,desde:ym(hoy()),hasta:'',activo:true};
  V._fj={...f};
  const accO=S.cfg.cuentas.filter(c=>!c.arch||c.n===f.c).map(c=>`<option value="${h(c.n)}"${c.n===f.c?' selected':''}>${h(c.n)} (${sym(c.mon)})</option>`).join('');
  const kO=t=>'<option value="">— elegir —</option>'+sortN(S.cfg.conceptos.filter(c=>c.tipo===t)).map(c=>`<option value="${h(c.n)}"${c.n===f.k?' selected':''}>${h(c.n)}</option>`).join('');
  modal(`<h3>${id?'Editar':'Nuevo'} gasto fijo</h3><form onsubmit="event.preventDefault();guardarFijo(${js(id||'')})">
   <div class="seg" style="margin-bottom:12px"><button type="button" class="${f.t==='G'?'on G':''}" onclick="V._fj.t='G';fjTipo('G')">Gasto</button><button type="button" class="${f.t==='I'?'on I':''}" onclick="fjTipo('I')">Ingreso</button></div>

function optsConcepto(t,sel){const cats={};for(const c of S.cfg.conceptos.filter(c=>c.tipo===t))(cats[c.cat||'Sin categoría']||(cats[c.cat||'Sin categoría']=[])).push(c);

function palabrasC(s){return ' '+norm(s).replace(/[^a-z0-9]+/g,' ').trim()+' '}
function conceptoPorReglas(txt,t){

  return best?best.v:'';
}

let EC=null;
function cargarPDF(){document.getElementById('pdfIn').click()}
function cargarScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
async function onPDF(inp){
  const file=inp.files[0];inp.value='';if(!file)return;
  toast('Leyendo el PDF…');
  try{
    if(!window.pdfjsLib){await cargarScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
      pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'}
    const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
    const lines=[];
    for(let pn=1;pn<=pdf.numPages;pn++){
      const page=await pdf.getPage(pn);const tc=await page.getTextContent();
      const its=tc.items.filter(i=>i.str&&i.str.trim()).map(i=>({s:i.str.trim(),x:i.transform[4],y:Math.round(i.transform[5]*2)/2,w:i.width||0}));
      its.sort((a,b)=>b.y-a.y||a.x-b.x);
      let cur=null;
      for(const it of its){if(!cur||Math.abs(cur.y-it.y)>2.5){cur={y:it.y,p:pn,items:[]};lines.push(cur)}cur.items.push(it)}
      lines.forEach(l=>l.items.sort((a,b)=>a.x-b.x));
    }
    EC=parseEstado(lines,file.name);
    if(!EC.items.length){toast('No encontré movimientos en el PDF. Mandame un ejemplo para ajustar la lectura.');return}
    renderEC();
  }catch(e){toast('No pude leer el PDF: '+(e.message||e))}
}
const RX_IMP=/^\(?-?\s?(?:U\$S|US\$|USD|\$)?\s?-?(?:\d+(?:[.,]\d{3})*)?[.,]\d{2}\)?-?(?:\s?CR)?$/i;
const RX_FEC=/^(\d{1,2})[\/\-.](\d{1,2})(?:[\/\-.](\d{2,4}))?$/;
const RX_FEC2=/^(\d{1,2})[\s\-\/]?(ene|feb|mar|abr|may|jun|jul|ago|sep|set|oct|nov|dic)[a-z]*\.?(?:[\s\-\/](\d{2,4}))?$/i;
const RX_FIN=/saldo contado|total a pagar|cargos del mes|ud\. ha generado/i;
const RX_INI=/saldo (del estado de cuenta )?anterior/i;
const RX_SKIP=/saldo (anterior|actual|a pagar|deudor anterior|pendiente|contado)|saldo del estado|^total\b|pago m[ií]nimo|l[ií]mite de|fecha de (cierre|vencimiento)|^vencimiento|cr[eé]dito disponible/i;
function fechaTok(s,refY,refM){
  let m=s.match(RX_FEC),d,mo,y;
  if(m){d=+m[1];mo=+m[2];y=m[3]?(+m[3]<100?2000+ +m[3]:+m[3]):null}
  else if((m=s.match(/^(\d{2})\s(\d{2})\s(\d{2,4})$/))){d=+m[1];mo=+m[2];y=+m[3]<100?2000+ +m[3]:+m[3]}
  else if((m=s.match(RX_FEC2))){d=+m[1];mo=MES3.indexOf(m[2].toLowerCase().replace('set','sep').slice(0,3))+1;y=m[3]?(+m[3]<100?2000+ +m[3]:+m[3]):null}
  if(!m||d<1||d>31||mo<1||mo>12)return null;
  if(!y)y=mo>refM?refY-1:refY;
  return y+'-'+p2(mo)+'-'+p2(d);
}
function formatoEC(txt){const m=txt.match(/cuenta:?\s*(\d{5,})/i)||txt.match(/\b(\d{6,})-\d\b/);return m?m[1]:'x'}
function parseEstado(lines,fname){
  const txt=lines.map(l=>l.items.map(i=>i.s).join(' ')).join('\n');
  // fecha de cierre (se usa para cargos sin fecha, como seguros)
  let cierre=null;
  const mc=txt.match(/fecha de cierre:?\s*(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/i)||txt.match(/\b(\d{1,2})\/(\d{1,2})\/(\d{2,4})\b/);
  if(mc){let y=+mc[3];if(y<100)y+=2000;cierre=y+'-'+p2(mc[2])+'-'+p2(mc[1])}
  const refY=cierre?+cierre.slice(0,4):+hoy().slice(0,4),refM=cierre?+cierre.slice(5,7):+hoy().slice(5,7);
  // columnas de moneda
  let colU=null,colD=null;
  for(const l of lines){const a=l.items.find(i=>/^(\$|\$U|UYU|PESOS|M\/N|IMPORTE \$)$/i.test(i.s)),b=l.items.find(i=>/^(U\$S|US\$|USD|D[OÓ]LARES|IMPORTE U\$S)$/i.test(i.s));if(a&&b&&b.x>a.x){colU=a.x+a.w/2;colD=b.x+b.w/2;break}}
  // bordes derechos típicos de cada columna, tomados de las líneas que traen las dos monedas
  const rU=[],rD=[];
  for(const l of lines){
    const lin=l.items.map(i=>i.s).join(' ').trim();
    if(!(/^saldo|^total/i.test(lin)||fechaTok((l.items[0]||{s:''}).s.trim(),2000,1)))continue;
    const t=l.items.filter(i=>RX_IMP.test(i.s.trim())&&/\d/.test(i.s));
    if(t.length===2){rU.push(t[0].x+t[0].w);rD.push(t[1].x+t[1].w)}}
  const prom=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
  const bordeU=prom(rU),bordeD=prom(rD);
  const items=[];let enTabla=false,tarjeta='';
  for(const l of lines){
    const linea=l.items.map(i=>i.s).join(' ').replace(/\s+/g,' ').trim();
    if(RX_INI.test(linea))enTabla=true;
    const tj=linea.match(/^tarjeta\s*(?:no:?\s*)?([\d*]{4,})\s*(?:-\s*(.+))?$/i);if(tj){tarjeta=tj[1].slice(-4)+(tj[2]?' '+tj[2].trim():'');continue}
    if(RX_FIN.test(linea)){enTabla=false;continue}
    let tk=[];for(const it of l.items){const parts=it.s.split(/\s{2,}/);let x=it.x;for(const s of parts){tk.push({s:s.trim(),x,w:it.w/parts.length});x+=it.w/parts.length}}
    tk=tk.filter(t=>t.s);
    if(tk.length>=3&&/^\d{2}$/.test(tk[0].s)&&/^\d{2}$/.test(tk[1].s)&&/^\d{2,4}$/.test(tk[2].s))tk.splice(0,3,{s:tk[0].s+' '+tk[1].s+' '+tk[2].s,x:tk[0].x,w:0});
    // importes: la secuencia de números al final de la línea
    const amts=[];let k=tk.length-1;
    while(k>=0){const s=tk[k].s;
      if(RX_IMP.test(s)&&/\d/.test(s)){amts.unshift({...tk[k]});k--;continue}
      if(s==='-'&&amts.length&&!amts[0].neg){amts[0].neg=true;k--;continue}
      break}
    if(!amts.length)continue;
    let fi=-1,f=null;
    for(let i=0;i<Math.min(2,k+1);i++){f=fechaTok(tk[i].s,refY,refM);if(f){fi=i;break}}
    if(!f){if(!enTabla||!cierre)continue;f=cierre}
    let i0=fi+1;if(tk[i0]&&/^\d{4,}$/.test(tk[i0].s)&&i0<k)i0++;   // código de comercio (Itaú)
    let d=tk.slice(i0,k+1).map(t=>t.s).join(' ').replace(/\s+/g,' ').trim();
    if(!d)continue;
    let q='';
    const cq=d.match(/(?:\bcuota\s*)?(\d{1,2})\s*\/\s*(\d{1,2})\s*$/i);
    if(cq&&+cq[1]>=1&&+cq[1]<=+cq[2]&&+cq[2]>1&&+cq[2]<=60){q=p2(+cq[1])+'/'+p2(+cq[2]);d=d.slice(0,cq.index).trim()}
    d=d.replace(/\s*cuota\s*$/i,'').replace(/(\d)cuota$/i,'$1').trim();
    if(RX_SKIP.test(d))continue;
    amts.forEach((a,ix)=>{
      let v=parseNum(a.s.replace(/CR/i,'').replace(/[()]/g,'').replace(/\s/g,''));
      if(a.neg||/^\(|\)$|-$|CR$/i.test(a.s)||a.s.trim().startsWith('-'))v=-Math.abs(v);
      if(!v||isNaN(v))return;
      let mon='UYU';
      if(amts.length>=2)mon=ix===amts.length-1?'USD':'UYU';
      else if(bordeU!=null&&bordeD!=null&&Math.abs(bordeD-bordeU)>8){const r=a.x+a.w;mon=Math.abs(r-bordeD)<Math.abs(r-bordeU)?'USD':'UYU'}
      else if(colU!=null&&colD!=null){const r=a.x+a.w;mon=r>colD-2?'USD':'UYU'}
      else if(/U\$S|US\$|\bUSD\b/i.test(linea))mon='USD';
      const esPago=v<0&&/\bpagos?\b|su pago|pago recibido|pago efectuado/i.test(d);
      items.push({f,d,m:r2(v),mon,q,usar:!esPago,pago:esPago,tj:tarjeta});
    });
  }
  const fs=items.filter(x=>!x.q||x.q.startsWith('01/')).map(x=>x.f).sort();
  const T=palabrasC(txt+' '+fname);
  const cand=S.cfg.cuentas.filter(c=>!c.arch&&c.mon==='UYU'&&/^tc\b|tarjeta|cr[eé]dito|visa|master/i.test(norm(c.n))&&['brou','bbva','santander','itau','scotiabank','hsbc','oca','prex'].some(b=>T.includes(' '+b+' ')&&palabrasC(c.n).includes(' '+b+' ')));
  const fmtId=formatoEC(txt);
  let cuenta=cand.length===1?cand[0].n:'';
  const recordada=lsGet('cg_ec_'+fmtId);if(!cuenta&&recordada&&acc(recordada))cuenta=recordada;
  // período: del día siguiente al cierre anterior hasta el cierre
  const desde=cierre?addDias(addMeses(cierre,-1),1):(fs[0]||'');
  return {items,desde,hasta:cierre||fs[fs.length-1]||'',cuenta,fname,fmt:fmtId};
}

   <p class="xs mu">Los pagos de la tarjeta vienen sin marcar porque ya son transferencias. Revisá que las líneas y los importes estén bien antes de seguir.</p>
   <div class="btns" style="justify-content:flex-end"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn pri" onclick="conciliar()">Conciliar</button></div>`);
}
function valorEn(x,acct){ // positivo = cargo en la tarjeta
  if(x.t==='G')return x.c===acct?x.m:0;
  if(x.t==='I')return x.c===acct?-x.m:0;
  if(x.t==='A')return x.c===acct?-x.m:0;
  if(x.t==='T'){if(x.c2===acct)return -(x.m2??x.m);if(x.c===acct)return x.m}
  return 0;
}
function dias(a,b){return Math.abs((new Date(a+'T12:00')-new Date(b+'T12:00'))/864e5)}
function conciliar(){
  const E=EC;E.cuenta=document.getElementById('ec_c').value;if(E.cuenta)lsSet('cg_ec_'+E.fmt,E.cuenta);E.desde=document.getElementById('ec_d').value;E.hasta=document.getElementById('ec_h').value;
  if(!E.cuenta){toast('Elegí la tarjeta');return}
  const A=acc(E.cuenta),B=(()=>{const base=n=>palabrasC(n).replace(/ (pesos|dolares|uyu|usd|u s) /g,' ').trim();return S.cfg.cuentas.find(c=>c.mon==='USD'&&base(c.n)===base(A.n))})();
  const ec='ec'+hash(E.cuenta+'|'+E.desde+'|'+E.hasta);
  const lin=E.items.filter(x=>x.usar).map((x,i)=>({...x,i,acct:x.mon==='USD'?(B?B.n:A.n):A.n}));
  const ini=addDias(E.desde,-10),fin=addDias(E.hasta,10);
  const cands=S.movs.filter(x=>x.f>=ini&&x.f<=fin&&(!x.cc||x.cc===ec)).flatMap(x=>[A.n,B&&B.n].filter(Boolean).map(a=>({x,a,v:valorEn(x,a)})).filter(o=>o.v));
  const usado=new Set(),match=[],difs=[];
  const esperado=l=>{const q=(l.q||'').split('/').map(Number);return q[1]>1&&q[0]>1?addMeses(l.f,q[0]-1):l.f};
  // 1) mismo importe y fecha cercana
  for(const l of lin){let best=null;
    for(const c of cands){if(usado.has(c)||c.a!==l.acct||Math.abs(c.v-l.m)>0.011)continue;
      let dd=Math.min(dias(c.x.f,l.f),dias(c.x.f,esperado(l)));
      // movimientos importados de ZetaCuentas sin día (fecha 1 del mes): alcanza con que sea el mismo mes
      if(/^z/.test(c.x.id)&&c.x.f.endsWith('-01')&&(c.x.f.slice(0,7)===l.f.slice(0,7)||c.x.f.slice(0,7)===esperado(l).slice(0,7)))dd=Math.min(dd,9.5);
      if(dd<=10&&(!best||dd<best.dd))best={c,dd}}
    if(best){usado.add(best.c);l.ok=true;match.push(best.c.x.id)}}
  // 2) misma fecha, importe parecido o mismo comercio
  for(const l of lin){if(l.ok)continue;let best=null;
    for(const c of cands){if(usado.has(c)||c.a!==l.acct||Math.sign(c.v)!==Math.sign(l.m))continue;const dd=Math.min(dias(c.x.f,l.f),dias(c.x.f,esperado(l)));if(dd>4)continue;
      const pal=palabrasC(l.d).split(' ').filter(w=>w.length>3),comun=pal.some(w=>palabrasC((c.x.d||'')+' '+(c.x.k||'')).includes(' '+w+' '));
      const imp=/^z/.test(c.x.id)&&c.x.f.endsWith('-01')&&(c.x.f.slice(0,7)===l.f.slice(0,7)||c.x.f.slice(0,7)===esperado(l).slice(0,7));
      if(imp&&Math.abs(c.v-l.m)/Math.abs(l.m)<=0.015){const sc=0.5;if(!best||sc<best.sc)best={c,sc};continue}
      if(comun||(!l.q&&!c.x.q&&Math.abs(c.v-l.m)/Math.abs(l.m)<=0.10&&dd<=2)){const sc=dd+(comun?0:3);if(!best||sc<best.sc)best={c,sc}}}
    if(best){usado.add(best.c);l.ok=true;difs.push({tipo:'importe',f:l.f,d:l.d,m:l.m,mon:l.mon,mov:best.c.x.id,mApp:Math.abs(best.c.v),q:l.q,c:l.acct})}}
  for(const l of lin)if(!l.ok)difs.push({tipo:'falta_app',f:l.f,d:l.d,m:l.m,mon:l.mon,q:l.q,c:l.acct});
  for(const c of cands)if(!usado.has(c)&&c.x.f>=E.desde&&c.x.f<=E.hasta&&!c.x.cc&&!(/^z/.test(c.x.id)&&c.x.f.endsWith('-01')))difs.push({tipo:'falta_estado',f:c.x.f,d:c.x.d||c.x.k||titulo(c.x),m:c.v,mon:monOf(c.a),mov:c.x.id,q:c.x.q||'',c:c.a});
  const n={falta_app:0,falta_estado:0,importe:0};difs.forEach(d=>n[d.tipo]++);
  E.res={ec,match,difs};
  modal(`<h3>Resultado de la conciliación</h3>
   <div class="kv"><span>Coinciden</span><b class="pos">${match.length}</b></div>
   <div class="kv"><span>En el estado y no en la app</span><b>${n.falta_app}</b></div>
   <div class="kv"><span>En la app y no en el estado</span><b>${n.falta_estado}</b></div>
   <div class="kv"><span>Importe distinto</span><b>${n.importe}</b></div>
   <p class="sm mu">Las coincidencias quedan marcadas como conciliadas. Las diferencias van a <b>Por clasificar</b> para que apruebes o rechaces cada una.</p>
   <div class="btns" style="justify-content:flex-end"><button class="btn" onclick="renderEC()">‹ Volver</button><button class="btn pri" id="btnEC" onclick="guardarEC()">Guardar</button></div>`);
}
function addDias(f,n){const d=new Date(f+'T12:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
async function guardarEC(){
  const {ec,match,difs}=EC.res;document.getElementById('btnEC').disabled=true;
  S.movs.forEach(x=>{if(match.includes(x.id))x.cc=ec});
  S.difs=S.difs.filter(d=>d.ec!==ec).concat(difs.map(d=>({...d,id:'tmp'+uid(),ec})));
  closeModal();go('clasificar');
  try{await op('guardarConciliacion',JSON.stringify({ec,cuenta:EC.cuenta,conciliados:match,difs}));load()}catch(e){}
  toast(`Conciliado: ${match.length} coinciden, ${difs.length} diferencias`);
}

function saveMov(otro){

  const o={id:x.id||uid(),t:x.t,f:x.f||hoy(),c:x.c,m:r2(m),ts:x.ts||Date.now()};
  if(x.t==='T'){o.c2=x.c2;if(monOf(x.c)!==monOf(x.c2)){const m2=parseNum(x.m2);if(!(m2>0)){toast('Ingresá el importe recibido');return}o.m2=r2(m2)}}
  if(x.t==='G'||x.t==='I')o.k=x.k;
  if(x.e&&x.e.trim())o.e=x.e.trim();
  if(x.d&&x.d.trim())o.d=x.d.trim();
  if(x.g){o.g=x.g;o.q=x.q}if(x.cc)o.cc=x.cc;
  const N=Math.max(1,Math.min(60,parseInt(x.n)||1));
  if(!x.id&&o.t==='G'&&N>1){
    const cs=crearCuotas(o,N,o.m);S.movs.push(...cs);invalidate();op('importMovs',JSON.stringify(cs));lsSet('cg_lastacc',o.c);
    toast(`Se crearon ${N} cuotas de ${fmt(cs[0].m,monOf(o.c))}`);
    if(otro){F={t:o.t,f:o.f,c:o.c,c2:'',k:'',e:'',d:'',m:'',n:1};renderForm()}else closeModal();
    render();return;
  }
  const i=S.movs.findIndex(y=>y.id===o.id);if(i>=0)S.movs[i]=o;else S.movs.push(o);
  invalidate();op('saveMov',JSON.stringify(o));lsSet('cg_lastacc',o.c);
  toast('Guardado');
  if(otro){F={t:o.t,f:o.f,c:o.c,c2:o.c2||'',k:'',e:'',d:'',m:''};renderForm();setTimeout(()=>document.getElementById('fm_m').focus(),60)}
  else closeModal();
  render();
}

function addMeses(f,n){const ymx=perStep(f.slice(0,7),n);const max=new Date(+ymx.slice(0,4),+ymx.slice(5,7),0).getDate();return ymx+'-'+p2(Math.min(+f.slice(8,10),max))}
function crearCuotas(base,N,total,desde){
  desde=desde||1;const g='g'+uid(),cu=Math.floor(total/N*100)/100,out=[];
  for(let k=desde;k<=N;k++){const m=k<N?cu:r2(total-cu*(N-1));const o={...base,id:g+'-'+k,f:addMeses(base.f,k-desde),m,g,q:k+'/'+N,ts:Date.now()+k};delete o.n;out.push(o)}
  return out;
}
