name: App de avisos (Android)

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compilar APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Preparar archivo
        run: cp android/app/build/outputs/apk/release/app-release.apk ControlGastos-Avisos.apk
      - name: Publicar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: avisos
          name: App de avisos para Android
          body: Descargá ControlGastos-Avisos.apk desde el celular e instalala.
          files: ControlGastos-Avisos.apk
          make_latest: true
